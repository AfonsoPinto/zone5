<style>
/* Layout: one-column mobile app, bottom tab bar, cards for workouts; track-red accent on cool slate */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#14202b; --muted:#5b6b7a; --line:#d6dde4;
  --accent:#c8402a; --accent-ink:#ffffff; --soft:#f6f8fa;
  --good:#1f8a5b; --warn:#a86512; --bad:#b42318;
  --zE:#2f8f6b; --zM:#2f6db5; --zT:#b7791f; --zI:#c8402a; --zR:#7a4bb5; --zP:#14202b;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f151b; --surface:#17202a; --ink:#e8edf2; --muted:#93a3b2; --line:#283541;
    --accent:#ff6a4d; --accent-ink:#1a0d09; --soft:#1c2733;
    --good:#4cc38a; --warn:#e0a54a; --bad:#ff7a6b;
    --zE:#4cc38a; --zM:#6aa5ee; --zT:#e0a54a; --zI:#ff6a4d; --zR:#b48cf0; --zP:#e8edf2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#17202a; --ink:#e8edf2; --muted:#93a3b2; --line:#283541;
  --accent:#ff6a4d; --accent-ink:#1a0d09; --soft:#1c2733;
  --good:#4cc38a; --warn:#e0a54a; --bad:#ff7a6b;
  --zE:#4cc38a; --zM:#6aa5ee; --zT:#e0a54a; --zI:#ff6a4d; --zR:#b48cf0; --zP:#e8edf2;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body{padding-bottom:84px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px} h2{font-size:24px} h3{font-size:19px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:30px}
.brand h1{font-size:28px;text-transform:uppercase;letter-spacing:.04em}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.local{background:var(--warn)}
main{display:flex;flex-direction:column;gap:14px;padding-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.hero{border-left:5px solid var(--accent)}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.eyebrow{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--ink);white-space:nowrap}
.z{color:#fff;border:none}
.zE{background:var(--zE)} .zM{background:var(--zM)} .zT{background:var(--zT)} .zI{background:var(--zI)} .zR{background:var(--zR)} .zP{background:var(--zP);color:var(--bg)} .zF{background:var(--muted)}
.st-done{color:var(--good);border-color:var(--good);background:transparent}
.st-miss{color:var(--bad);border-color:var(--bad);background:transparent}
.st-next{color:var(--accent);border-color:var(--accent);background:transparent}
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.steps .bar{width:4px;border-radius:2px;align-self:stretch;min-height:22px}
.steps .t{font-weight:600}
.steps .p{font-size:14px;color:var(--muted)}
button,.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;cursor:pointer;min-height:44px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button.link{border:none;background:none;padding:6px 0;min-height:0;color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>*{flex:1 1 auto}
label{font-size:14px;font-weight:600;display:flex;flex-direction:column;gap:6px}
input,select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);min-height:44px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 0;min-width:64px;padding:9px 8px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-size:12px;cursor:pointer;min-height:64px;color:var(--ink)}
.day b{font-family:var(--display);font-size:15px}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day .mk{width:10px;height:10px;border-radius:50%}
.day .km{font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted)}
.note{border-left:3px solid var(--line);padding:2px 0 2px 10px;font-size:14.5px}
.note.up{border-color:var(--good)} .note.down{border-color:var(--warn)} .note.info{border-color:var(--zM)}
.suggest{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
details.wk{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.wk>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.wk>summary::-webkit-details-marker{display:none}
details.wk[open]>summary{border-bottom:1px solid var(--line)}
.wrow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;font-weight:400;border-radius:0;min-height:0;color:var(--ink)}
.wrow:last-child{border-bottom:none}
.wrow .d{font-family:var(--display);font-size:15px;line-height:1.1}
.table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.table td,.table th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.table th{font-size:12.5px;color:var(--muted);font-weight:600}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:600;color:var(--muted);text-decoration:none;padding:6px 0;border-radius:10px}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,15,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.drop input{display:none}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.split{display:flex;align-items:flex-end;gap:3px;height:56px}
.split div{flex:1;background:var(--zM);border-radius:3px 3px 0 0;min-width:4px}
.rank{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:none}
.rank .pos{font-family:var(--display);font-size:22px;font-weight:700;color:var(--muted);text-align:center}
.rank.me{background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:10px;padding:10px 8px}
.rbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}.rbar>div{height:100%;background:var(--accent)}
.code{font-family:var(--display);font-size:32px;letter-spacing:.2em;font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:380px){.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="#14202b"/><rect x="6" y="19" width="3.2" height="6" rx="1.2" fill="#fff" opacity=".35"/><rect x="10.6" y="16" width="3.2" height="9" rx="1.2" fill="#fff" opacity=".5"/><rect x="15.2" y="13" width="3.2" height="12" rx="1.2" fill="#fff" opacity=".68"/><rect x="19.8" y="10" width="3.2" height="15" rx="1.2" fill="#fff" opacity=".86"/><rect x="24.4" y="6" width="3.2" height="19" rx="1.2" fill="#ff5a3c"/></svg>
      <h1>Zone<span style="color:var(--accent)">5</span></h1>

<script id="logic">
/* ===================== Lógica pura (ritmos, plano, análise) ===================== */
const GOALS={'5k':{km:5,label:'5 km'},'10k':{km:10,label:'10 km'},'meia':{km:21.0975,label:'Meia maratona'},'maratona':{km:42.195,label:'Maratona'}};
const ZN={E:'Fácil',M:'Ritmo maratona',T:'Limiar',I:'Intervalos',R:'Velocidade',P:'Ritmo de prova',F:'Força'};
const zOf=w=>w.type==='F'?'F':(w.type==='E'||w.type==='L')?'E':w.focus.z;
const WHY={
 'Corrida fácil':'Constrói a base aeróbia e ajuda a recuperar. Deves conseguir falar em frases completas. Se tiveres dúvidas, vai mais devagar.',
 'Fácil + acelerações':'Rodagem fácil com acelerações curtas no fim. As acelerações treinam a técnica e a passada sem cansar.',
 'Longo':'O treino mais importante da semana para a resistência. Ritmo calmo e constante, do início ao fim.',
 'Longo com final rápido':'Ensina o corpo a manter o ritmo com as pernas cansadas, como na parte final da prova.',
 'Fartlek':'Mudanças de ritmo por sensação. Desenvolve velocidade sem a pressão de bater tempos exatos.',
 'Tempo run':'Corrida contínua "confortavelmente dura". Sobe o limiar: o ritmo que consegues aguentar sem quebrar.',
 'Limiar fracionado':'O mesmo estímulo do tempo run, dividido em blocos com pausas curtas. Mais volume no ritmo certo.',
 'Intervalos':'Séries perto do teu VO2 máx. Aumentam a capacidade aeróbia máxima. Mantém todas as séries iguais e não ganhes a primeira.',
 'Ritmo de prova':'Habitua o corpo e a cabeça ao ritmo exato que queres manter no dia da prova.',
 'Ritmo maratona':'Bloco longo no ritmo de maratona. Treina a economia e a gestão de energia.',
 'Afinação':'Pouco volume com algum ritmo, para chegares fresco à prova sem perder a velocidade.',
 'Força A':'A força reduz o risco de lesão e melhora a economia de corrida. Faz os movimentos controlados.',
 'Força B':'Trabalho de estabilidade e reatividade: pés, anca e tronco mais fortes.'
};
const STRENGTH={
 A:[['Agachamento','3 × 12'],['Lunge à retaguarda','3 × 10 por perna'],['Ponte de glúteos','3 × 15'],['Elevação de gémeos','3 × 15'],['Prancha','3 × 40 s']],
 B:[['Peso morto a 1 perna','3 × 10 por perna'],['Step-up num banco','3 × 10 por perna'],['Prancha lateral','3 × 30 s por lado'],['Dead bug','3 × 10'],['Saltos no lugar (pogo)','3 × 20']]
};
function mkStrength(v){return{type:'F',title:'Força '+v,steps:STRENGTH[v].map(([t,d])=>({t,d,z:'F'})),focus:{z:'F'},min:25};}
let LANG=(()=>{try{const s=localStorage.getItem('zone5.lang');if(s==='pt'||s==='en')return s;}catch(e){}try{return (navigator.language||'en').toLowerCase().startsWith('pt')?'pt':'en';}catch(e){return 'en';}})();
const L=(pt,en)=>LANG==='pt'?pt:en;
const DOW_PT=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'],DOW_EN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MES_PT=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],MES_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let DOW=LANG==='pt'?DOW_PT:DOW_EN,MES=LANG==='pt'?MES_PT:MES_EN;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const r05=x=>Math.round(x*2)/2;
const nf=x=>LANG==='pt'?String(x).replace('.',','):String(x);

// datas como 'AAAA-MM-DD' em UTC
const toD=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(Date.UTC(a,b-1,c));};
const toS=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=toD(s);d.setUTCDate(d.getUTCDate()+n);return toS(d);};
const dow=s=>(toD(s).getUTCDay()+6)%7;
const mondayOf=s=>addDays(s,-dow(s));
const daysBetween=(a,b)=>Math.round((toD(b)-toD(a))/864e5);
function localToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
const fmtDate=s=>{const d=toD(s);return LANG==='pt'?`${d.getUTCDate()} ${MES[d.getUTCMonth()]}`:`${MES[d.getUTCMonth()]} ${d.getUTCDate()}`;};

// tempos
function fmtPace(s){if(!isFinite(s)||s<=0)return '–';s=Math.round(s);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function fmtTime(s){if(!isFinite(s))return '–';s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`;}
function parseTime(str){if(!str)return NaN;const p=String(str).trim().replace(/[hH]/g,':').replace(/[^\d:.,]/g,'').split(':').map(x=>parseFloat(x.replace(',','.')));if(p.some(isNaN))return NaN;let s=0;for(const v of p)s=s*60+v;if(p.length===1)s=p[0]*60;return s;}

// modelo VDOT (Daniels & Gilbert)
const vo2At=v=>-4.6+0.182258*v+0.000104*v*v;
const pctMax=t=>0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);
function vdotFrom(m,s){const t=s/60;return vo2At(m/t)/pctMax(t);}
function velFor(vo2){const a=0.000104,b=0.182258,c=-(vo2+4.6);return(-b+Math.sqrt(b*b-4*a*c))/(2*a);}
const paceAtFrac=(vdot,f)=>60000/velFor(vdot*f);
function predict(vdot,m){let lo=m/12,hi=m/0.8;for(let i=0;i<70;i++){const mid=(lo+hi)/2;if(vdotFrom(m,mid)>vdot)lo=mid;else hi=mid;}return(lo+hi)/2;}
function paces(vdot,goal){
  const P=predict(vdot,GOALS[goal].km*1000)/GOALS[goal].km;
  const I=paceAtFrac(vdot,0.975);
  return{E:[paceAtFrac(vdot,0.74),paceAtFrac(vdot,0.65)],M:predict(vdot,42195)/42.195,T:paceAtFrac(vdot,0.88),I,R:I-15,P};
}
const target=(pz,z)=>z==='E'?pz.E[0]:pz[z];

/* ---------- Geração do plano ---------- */
const TEMPL={3:[[1,'Q1'],[3,'E'],[6,'L']],4:[[1,'Q1'],[2,'E'],[4,'Q2'],[6,'L']],5:[[0,'E'],[1,'Q1'],[3,'Q2'],[4,'E'],[6,'L']],6:[[0,'E'],[1,'Q1'],[2,'E'],[3,'Q2'],[4,'E'],[6,'L']]};

function stepsKm(steps){let k=0;for(const s of steps){if(s.reps)k+=s.reps*(s.repKm||0)+(s.reps-1)*(s.restKm||0);else k+=s.km||0;}return k;}

function mkEasy(km,strides){const st=[{t:`${nf(km)} km fácil`,km,z:'E'}];if(strides)st.push({t:'6 × 20 s rápidos, 1 min trote entre',km:0,z:'R'});return{type:'E',title:strides?'Fácil + acelerações':'Corrida fácil',steps:st,focus:{z:'E'}};}

function mkQ(kind,o){ // o: {vol, goal, level, scale}
  const wu=r05(clamp(o.vol*0.06,1.5,3)),cd=r05(clamp(o.vol*0.05,1,2.5));
  const W={t:`${nf(wu)} km aquecimento`,km:wu,z:'E'},C={t:`${nf(cd)} km retorno à calma`,km:cd,z:'E'};
  const sc=o.scale||1;
  if(kind==='fartlek'){const n=Math.round(clamp(o.vol*0.3*sc,6,12));return{type:'Q',title:'Fartlek',steps:[W,{t:`${n} × 1 min forte / 1 min fácil`,reps:n,repSec:60,repKm:0.25,restKm:0.15,z:'I'},C],focus:{z:'I',repSec:60}};}
  if(kind==='tempo'){const k=r05(clamp(o.vol*0.1*sc,2,6));return{type:'Q',title:'Tempo run',steps:[W,{t:`${nf(k)} km contínuo`,km:k,z:'T'},C],focus:{z:'T',km:k}};}
  if(kind==='cruise'){const rk=o.goal==='meia'||o.goal==='maratona'?2:1.6;const n=Math.round(clamp(o.vol*0.1*sc/rk,2,5));return{type:'Q',title:'Limiar fracionado',steps:[W,{t:`${n} × ${fmtKm(rk)}`,reps:n,repKm:rk,restKm:0.2,rest:'1 min trote',z:'T'},C],focus:{z:'T',km:rk}};}
  if(kind==='intervals'){const rk=o.goal==='5k'?0.8:1;const n=Math.round(clamp(o.vol*0.08*sc/rk,3,8));return{type:'Q',title:'Intervalos',steps:[W,{t:`${n} × ${fmtKm(rk)}`,reps:n,repKm:rk,restKm:0.4,rest:rk<1?'2 min trote':'2–3 min trote',z:'I'},C],focus:{z:'I',km:rk}};}
  if(kind==='racepace'){const rk=o.goal==='5k'?1:o.goal==='10k'?2:3;const n=Math.round(clamp(o.vol*0.12*sc/rk,2,5));return{type:'Q',title:'Ritmo de prova',steps:[W,{t:`${n} × ${fmtKm(rk)}`,reps:n,repKm:rk,restKm:0.3,rest:'2 min trote',z:'P'},C],focus:{z:'P',km:rk}};}
  if(kind==='mpace'){const k=r05(clamp(o.vol*0.18*sc,5,14));return{type:'Q',title:'Ritmo maratona',steps:[W,{t:`${nf(k)} km contínuo`,km:k,z:'M'},C],focus:{z:'M',km:k}};}
  if(kind==='sharpen'){const n=4;return{type:'Q',title:'Afinação',steps:[W,{t:`${n} × 1 km`,reps:n,repKm:1,restKm:0.3,rest:'2 min trote',z:'P'},C],focus:{z:'P',km:1}};}
  return mkEasy(r05(o.vol*0.15),true);
}
function fmtKm(k){return k<1?`${Math.round(k*1000)} m`:`${nf(k)} km`;}

function qKinds(phase,goal,level,recovery){
  const beg=level==='ini';
  let q1,q2;
  if(phase==='base'){q1=beg?'strides':'fartlek';q2='tempo';}
  else if(phase==='build'){q1=(goal==='5k'||goal==='10k')?'intervals':'cruise';q2=goal==='maratona'?'mpace':(goal==='meia'?'intervals':'cruise');if(beg&&q1==='intervals')q1='fartlek';}
  else if(phase==='peak'){q1=goal==='5k'?'intervals':goal==='10k'?'racepace':'cruise';q2=goal==='maratona'?'mpace':goal==='meia'?'racepace':'cruise';}
  else {q1='sharpen';q2=null;}
  if(recovery)q2=null;
  return[q1,q2];
}

function genPlan(p,todayS){
  const g=GOALS[p.goal],days=clamp(p.days|0,3,6);
  const mon0=mondayOf(todayS);
  let N=p.raceDate&&p.raceDate>todayS?Math.floor(daysBetween(mon0,mondayOf(p.raceDate))/7)+1:({'5k':8,'10k':10,'meia':12,'maratona':16})[p.goal];
  N=clamp(N,1,30);
  const lvl={ini:14,int:24,ava:38}[p.level]||24;
  const dayF={3:0.85,4:1,5:1.15,6:1.3}[days];
  const goalF={'5k':0.9,'10k':1,'meia':1.1,'maratona':1.3}[p.goal];
  const startVol=lvl*dayF*goalF;
  const T=N<6?1:(p.raceDate?({'5k':1,'10k':1,'meia':2,'maratona':3})[p.goal]:1);
  const TW=Math.max(0,N-T);
  const peakF={'5k':1.35,'10k':1.45,'meia':1.55,'maratona':1.7}[p.goal];
  const peakVol=Math.min(startVol*peakF,startVol*(1+0.08*Math.max(TW-1,0)));
  const goalLong={'5k':[9,12,14],'10k':[12,15,18],'meia':[16,19,22],'maratona':[28,32,34]}[p.goal][{ini:0,int:1,ava:2}[p.level]??1];
  const peakLong=Math.min(goalLong,peakVol*(p.goal==='maratona'?0.6:0.45));
  const startLong=clamp(startVol*0.3,5,peakLong);
  const nb=Math.round(TW*0.4),nbu=Math.round(TW*0.35);
  const taperF={1:[0.55],2:[0.75,0.5],3:[0.8,0.65,0.45]}[T];
  const shift=((p.longDay??6)-6+7)%7;
  const weeks=[];
  for(let i=0;i<N;i++){
    let phase,vol,long,rec=false;
    if(i<TW){
      phase=i<nb?'base':i<nb+nbu?'build':'peak';
      const f=TW>1?i/(TW-1):1;
      vol=startVol+(peakVol-startVol)*f;long=startLong+(peakLong-startLong)*f;
      if((i+1)%4===0&&i<TW-1){rec=true;vol*=0.78;long*=0.8;}
    }else{phase='taper';const j=i-TW;vol=peakVol*taperF[j];long=peakLong*({1:[0.5],2:[0.7,0.4],3:[0.75,0.6,0.35]}[T][j]);}
    const isLast=i===N-1;
    const ws=mondayOf(addDays(mon0,i*7));
    const [k1,k2]=qKinds(phase,p.goal,p.level,rec);
    const slots=TEMPL[days].map(([d,k])=>[(d+shift)%7,k]);
    const ws_=[];
    let qKm=0;const qs={};
    const o={vol,goal:p.goal,level:p.level,scale:rec?0.75:1};
    for(const [d,k] of slots){
      if(k==='Q1'){const q=k1==='strides'?mkEasy(r05(clamp(vol*0.2,3,8)),true):mkQ(k1,o);qs[d]=q;qKm+=stepsKm(q.steps);}
      if(k==='Q2'&&k2){const q=mkQ(k2,o);qs[d]=q;qKm+=stepsKm(q.steps);}
    }
    long=r05(long);
    const nE=slots.filter(([d,k])=>!qs[d]&&k!=='L').length;
    const eKm=nE?r05(clamp((vol-long-qKm)/nE,3,12)):0;
    for(const [d,k] of slots){
      const date=addDays(ws,d);
      let w;
      if(qs[d])w=qs[d];
      else if(k==='L'){
        const fin=(p.goal==='maratona'||p.goal==='meia')&&(phase==='build'||phase==='peak')&&!rec&&i%2===1;
        if(fin){const z=p.goal==='maratona'?'M':'P';const fk=r05(clamp(long*0.3,3,10));w={type:'L',title:'Longo com final rápido',steps:[{t:`${nf(r05(long-fk))} km fácil`,km:r05(long-fk),z:'E'},{t:`${nf(fk)} km finais`,km:fk,z}],focus:{z:'E'}};}
        else w={type:'L',title:'Longo',steps:[{t:`${nf(long)} km fácil`,km:long,z:'E'}],focus:{z:'E'}};
      }else w=mkEasy(eKm,days>=4&&d===slots.find(([dd,kk])=>kk==='E'&&!qs[dd])?.[0]&&phase!=='taper');
      w={...w,id:`w${i}-${d}`,date,km:Math.round(stepsKm(w.steps)*10)/10};
      if(w.type==='E'&&p.strength===false&&(phase==='base'||phase==='build')&&!rec)w.strength=true;
      ws_.push(w);
    }
    let list=ws_;
    if(isLast){
      if(p.raceDate&&p.raceDate>todayS){
        const rd=p.raceDate;
        list=list.filter(w=>w.date<addDays(rd,-1));
        list=list.map(w=>w.type==='Q'&&w.date>addDays(rd,-3)?{...mkEasy(4,true),id:w.id,date:w.date,km:4}:w);
        list=list.filter(w=>w.type!=='L');
        list.push({id:`w${i}-race`,date:rd,type:'R',title:`Prova: ${g.label}`,steps:[{t:`${fmtKm(Math.round(g.km*10)/10)} em ritmo de prova`,km:g.km,z:'P'}],focus:{z:'P',km:g.km},km:Math.round(g.km*10)/10});
      }else{
        const tk=Math.min(g.km,10);
        list=list.map(w=>w.type==='L'?{id:w.id,date:w.date,type:'R',title:`Teste: ${fmtKm(tk)} a fundo`,steps:[{t:'2 km aquecimento',km:2,z:'E'},{t:`${fmtKm(tk)} a fundo`,km:tk,z:'P'},{t:'1 km retorno à calma',km:1,z:'E'}],focus:{z:'P',km:tk,test:true},km:tk+3}:w);
      }
    }
    if(p.strength!==false&&phase!=='taper'){
      const used=new Set(list.map(w=>dow(w.date)));
      const longD=(p.longDay??6);
      const free=[0,1,2,3,4,5,6].filter(d=>!used.has(d)&&d!==(longD+6)%7&&d!==longD);
      const nS=rec?1:2;
      const pick=[];for(const d of free){if(pick.length>=nS)break;if(pick.every(x=>Math.abs(x-d)>1))pick.push(d);}
      for(const d of free){if(pick.length>=nS)break;if(!pick.includes(d))pick.push(d);}
      pick.slice(0,nS).forEach((d,k)=>{const f=mkStrength(k===0?'A':'B');list.push({...f,id:`w${i}-f${d}`,date:addDays(ws,d),km:0});});
    }
    list=list.filter(w=>w.date>=todayS).sort((a,b)=>a.date<b.date?-1:1);
    weeks.push({n:i+1,start:ws,phase,recovery:rec,workouts:list});
  }
  return{start:mon0,weeks:weeks.filter(w=>w.workouts.length)};
}

/* ---------- GPX ---------- */
function hav(a,b){const R=6371000,t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lon-a.lon)*t;const x=Math.sin(dl/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function analyzePoints(raw){
  const pts=[];let d=0,hrS=0,hrN=0,moving=0;
  for(let i=0;i<raw.length;i++){
    const p=raw[i];if(!isFinite(p.t))continue;
    if(pts.length){const q=pts[pts.length-1];const dd=hav(q,p),dt=p.t-q.t;if(dt<=0)continue;d+=dd;if(dd/dt>1.0&&dt<30)moving+=dt;}
    pts.push({lat:p.lat,lon:p.lon,t:p.t,d});
    if(p.hr){hrS+=p.hr;hrN++;}
  }
  if(pts.length<2)return null;
  const t0=pts[0].t;
  const splits=[];let next=1000,last=t0;
  for(const p of pts){if(p.d>=next){splits.push(p.t-last);last=p.t;next+=1000;}}
  return{pts,dist:d/1000,elapsed:pts[pts.length-1].t-t0,moving,avgHr:hrN?Math.round(hrS/hrN):null,splits,t0};
}
function bestEffort(pts,m){let j=0,best=Infinity;for(let i=0;i<pts.length;i++){while(j<pts.length&&pts[j].d-pts[i].d<m)j++;if(j>=pts.length)break;const t=pts[j].t-pts[i].t;if(t<best)best=t;}return isFinite(best)?best/(m/1000):null;}

/* ---------- Análise de um treino ---------- */
function evaluate(log,w,vdot,goal){
  const pz=paces(vdot,goal);
  const pace=log.time/log.dist;
  const res={msg:'',cls:'info',flag:null,fatigue:false};
  if(!w){res.msg=`Corrida extra a ${fmtPace(pace)}/km.`;if(log.rpe>=8)res.fatigue=true;return res;}
  if(w.type==='R'){
    if(log.dist>=3){const v=vdotFrom(log.dist*1000,log.time);res.newVdot=v;res.cls=v>=vdot?'up':'down';res.msg=`${w.focus.test?'Teste':'Prova'} feito em ${fmtTime(log.time)}. Ritmos recalculados com base neste resultado.`;}
    else res.msg='Distância demasiado curta para recalcular os ritmos.';
    return res;
  }
  const planned=w.km||0;
  const short=planned&&log.dist<planned*0.7;
  if(w.type==='Q'&&w.focus.z!=='E'){
    const tgt=target(pz,w.focus.z);
    const act=log.fast||null;
    if(act){
      const diff=(tgt-act)/tgt;
      if(diff>0.03){res.msg=`Partes rápidas a ${fmtPace(act)}/km, mais rápido do que o alvo (${fmtPace(tgt)}).`;res.cls='up';if(log.rpe<=7)res.flag='up';}
      else if(diff<-0.04){res.msg=`Partes rápidas a ${fmtPace(act)}/km, abaixo do alvo (${fmtPace(tgt)}).`;res.cls='down';res.flag='down';}
      else{res.msg=`Partes rápidas a ${fmtPace(act)}/km, em cima do alvo (${fmtPace(tgt)}).`;res.cls='up';}
    }else{
      res.msg=log.rpe<=5?'Sessão de qualidade com esforço baixo. Se se repetir, os ritmos podem subir.':log.rpe>=9?'Sessão muito dura.':'Sessão registada.';
      if(log.rpe>=9){res.cls='down';res.flag='down';}
    }
    if(log.rpe>=9)res.fatigue=true;
  }else{
    const ef=pz.E[0];
    if(pace<ef*0.95){res.msg=`Ritmo médio ${fmtPace(pace)}/km: rápido para um treino fácil (alvo ${fmtPace(pz.E[0])}–${fmtPace(pz.E[1])}). Abranda para recuperar melhor.`;res.cls='down';}
    else res.msg=`Ritmo médio ${fmtPace(pace)}/km, dentro do fácil. Bom trabalho.`,res.cls='up';
    if(log.rpe>=8){res.fatigue=true;res.msg+=' O esforço foi alto para um fácil: atenção ao cansaço.';res.cls='down';}
  }
  if(short)res.msg+=` Fizeste ${nf(Math.round(log.dist*10)/10)} de ${nf(planned)} km previstos.`;
  return res;
}

const EN_EXACT={};      // preenchido mais abaixo
const EN_RX=[];         // [regex, substituição]
function tr(s){
  if(LANG!=='en'||s==null)return s;s=String(s);
  const lead=s.match(/^\s*/)[0],trail=s.match(/\s*$/)[0];let core=s.trim();
  if(!core||!/[A-Za-zÀ-ú]/.test(core))return s;
  core=core.replace(/(\d),(\d)/g,'$1.$2');
  return lead+trCore(core)+trail;
}
function trCore(core,depth=0){
  if(EN_EXACT[core]!=null)return EN_EXACT[core];
  const np=core.replace(/\.$/,'');if(np!==core&&EN_EXACT[np]!=null)return EN_EXACT[np].replace(/\.?$/,'.');
  for(const [rx,rp] of EN_RX){if(rx.test(core))return core.replace(rx,rp);}
  if(depth>3)return core;
  if(/\s·\s|^·\s/.test(core))return core.split(/(\s*·\s*)/).map(p=>/^\s*·\s*$/.test(p)||!p.trim()?p:trCore(p.trim(),depth+1)).join('');
  const sent=core.split(/(?<=[.!?])\s+(?=[A-ZÀ-Ú])/);
  if(sent.length>1)return sent.map(x=>trCore(x,depth+1)).join(' ');
  const ci=core.indexOf(': ');if(ci>0)return trCore(core.slice(0,ci),depth+1)+': '+trCore(core.slice(ci+2),depth+1);
  return core;
}
function trNode(root){
  if(LANG!=='en'||!root)return;
  if(root.nodeType===3){const v=tr(root.nodeValue);if(v!==root.nodeValue)root.nodeValue=v;return;}
  if(root.nodeType!==1)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n=root;
  do{
    if(n.nodeType===3){const p=n.parentNode;if(p&&(p.tagName==='SCRIPT'||p.tagName==='STYLE'))continue;const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
    else for(const a of ['placeholder','aria-label','title']){const v=n.getAttribute(a);if(v){const t=tr(v);if(t!==v)n.setAttribute(a,t);}}
  }while((n=w.nextNode()));
}

/* ===================== Estado, persistência e interface ===================== */
let st=null,saving=false,pend=false,TODAY=localToday();
let sb=null,user=null,mode=null; // mode: 'cloud' | 'demo' | null (por entrar)
const lsKey=()=>'zone5.v1.'+(user?user.id:'demo');
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2800);}
function setSync(k){$('#syncDot').className='dot '+(k==='ok'?'ok':k==='local'?'local':'');$('#syncTxt').textContent=k==='ok'?'Sincronizado':k==='local'?(mode==='demo'?'Modo experiência':'Sem ligação'):k==='off'?'':'A ligar…';}
try{if(CONFIG.SUPABASE_URL&&window.supabase)sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});}catch(e){sb=null;}
function readLocal(){try{const s=localStorage.getItem(lsKey());return s?JSON.parse(s):null;}catch(e){return null;}}

async function persist(){
  st.updated=Date.now();
  try{localStorage.setItem(lsKey(),JSON.stringify(st));}catch(e){}
  maybeAutoSync();
  if(mode!=='cloud'||!sb||!user)return;
  if(saving){pend=true;return;}
  saving=true;
  try{
    const {error}=await sb.from('user_state').upsert({user_id:user.id,state:st,updated_at:new Date(st.updated).toISOString()});
    if(error)throw error;
    setSync('ok');pushStats();
  }catch(e){setSync('local');}
  saving=false;
  if(pend){pend=false;persist();}
}
async function loadCloud(){
  setSync('wait');
  const local=readLocal();
  try{
    const {data,error}=await sb.from('user_state').select('state,updated_at').eq('user_id',user.id).maybeSingle();
    if(error)throw error;
    const remote=data?.state||null;
    if(remote&&(!local||(remote.updated||0)>=(local.updated||0)))st=remote;
    else if(local)st=local;
    else{const demo=(()=>{try{return JSON.parse(localStorage.getItem('zone5.v1.demo'));}catch(e){return null;}})();st=demo||null;}
    try{if(st)localStorage.setItem(lsKey(),JSON.stringify(st));}catch(e){}
    if(st&&(!remote||(st.updated||0)>(remote.updated||0)))await persist();
    setSync('ok');
  }catch(e){st=local;setSync('local');toast('Sem ligação: estás a ver a última cópia guardada neste dispositivo.');}
}
async function boot(){
  if(sb){
    const {data}=await sb.auth.getSession();
    if(data?.session){user=data.session.user;mode='cloud';await loadCloud();}
    sb.auth.onAuthStateChange((ev,session)=>{if(ev==='SIGNED_OUT'){user=null;mode=null;st=null;render();}if(ev==='PASSWORD_RECOVERY'){openSheet(`<h2>Nova palavra-passe</h2><label for="np">Palavra-passe nova<input type="password" id="np" autocomplete="new-password"></label><button class="primary" data-act="newpass">Guardar</button>`);}});
  }
  if(!mode&&localStorage.getItem('zone5.mode')==='demo'){mode='demo';st=readLocal();setSync('local');}
  if(!mode)setSync('off');
  if(st&&st.profile)checkFatigue();
  render();
  setTimeout(maybeAutoSync,3000);
}

/* ---------- Estatísticas para o grupo ---------- */
let lastStats='';
function weekStats(start){
  const wk=st.plan.weeks.find(w=>w.start===start);
  const end=addDays(start,7);
  const runs=st.logs.filter(l=>l.wtype!=='F'&&l.dist>0&&l.date>=start&&l.date<end);
  const planned=wk?wk.workouts.filter(x=>x.type!=='F').length:0;
  const done=wk?wk.workouts.filter(x=>x.type!=='F'&&logFor(x)).length:0;
  return{week_start:start,km:Math.round(runs.reduce((a,l)=>a+l.dist,0)*10)/10,runs:done,planned};
}
async function pushStats(){
  if(mode!=='cloud'||!st?.plan)return;
  const cur=mondayOf(TODAY);
  const rows=[weekStats(cur),weekStats(addDays(cur,-7))].map(r=>({...r,user_id:user.id,updated_at:new Date().toISOString()}));
  const key=JSON.stringify(rows.map(r=>[r.week_start,r.km,r.runs,r.planned]));
  if(key===lastStats)return;
  try{const {error}=await sb.from('weekly_stats').upsert(rows);if(!error)lastStats=key;}catch(e){}
}

let grp={loaded:false,groups:[],active:null,members:[],stats:[],week:'cur',err:''};
async function loadGroup(){

    const {data:mem,error}=await sb.from('group_members').select('group_id,groups(id,name,code)').eq('user_id',user.id);

    if(!grp.active||!grp.groups.find(g=>g.id===grp.active))grp.active=grp.groups[0]?.id||null;
    if(grp.active){

/* ---------- helpers de estado ---------- */
const allW=()=>st.plan.weeks.flatMap(w=>w.workouts);
const logFor=w=>st.logs.find(l=>l.date===w.date&&l.wid===w.id)||st.logs.find(l=>l.date===w.date&&!l.wid&&!l.extra);
const pz=()=>paces(st.vdot,st.profile.goal);
function status(w){if(logFor(w))return'done';if(w.date<TODAY)return st.skipped?.includes(w.id)?'skip':'miss';if(w.date===TODAY)return'today';return'next';}
function weekOf(date){return st.plan.weeks.find(w=>date>=w.start&&date<addDays(w.start,7));}
function addNote(text,kind){st.notes.unshift({d:TODAY,text,kind});st.notes=st.notes.slice(0,40);}
const PH={base:'Base',build:'Desenvolvimento',peak:'Específico',taper:'Afinação'};

function paceTxt(z){const p=pz();if(z==='E')return `${fmtPace(p.E[0])}–${fmtPace(p.E[1])}/km`;return `${fmtPace(p[z])}/km`;}
function stepHtml(s){
  if(s.z==='F')return `<li><span class="bar zF"></span><div><div class="t">${esc(s.t)}</div><div class="p num">${esc(s.d)}</div></div></li>`;
  const p=pz();let extra='';
  if(s.reps&&s.repKm&&!s.repSec){extra=` · ≈ ${fmtTime(target(p,s.z)*s.repKm)} cada`;}
  if(s.repSec){extra=` · cerca de ${fmtKm(Math.round(60/target(p,s.z)*1000/10)/100)} cada`;}
  const pace=s.z==='R'&&!s.reps?'ritmo solto e rápido, sem sprintar':paceTxt(s.z);
  return `<li><span class="bar z${s.z}"></span><div><div class="t">${esc(s.t)}</div><div class="p num">${pace}${extra}${s.rest?' · rec. '+esc(s.rest):''}</div></div></li>`;
}
function zonePill(z){return `<span class="pill z z${z}">${ZN[z]}</span>`;}
function workoutCard(w,hero){
  const s=status(w),l=logFor(w);
  const stPill=s==='done'?'<span class="pill st-done">Feito</span>':s==='miss'?'<span class="pill st-miss">Falhado</span>':s==='skip'?'<span class="pill">Saltado</span>':s==='today'?'<span class="pill st-next">Hoje</span>':'';
  const z=zOf(w),F=w.type==='F';
  const why=WHY[w.title]||(w.type==='R'?'O dia de mostrar o trabalho feito. Começa controlado e acelera na segunda metade.':'');
  const future=w.date>=TODAY&&!l;
  let btns='';
  if(l)btns=`<button class="ghost" data-act="dellog" data-id="${w.id}">Apagar registo</button>`;
  else if(F)btns=`<button class="primary" data-act="fdone" data-id="${w.id}">Marcar como feito</button>`;
  else btns=`<button class="primary" data-act="log" data-id="${w.id}">Registar treino</button>${w.date===TODAY||s==='next'?`<button data-act="guide" data-id="${w.id}">Treino guiado</button>`:''}`;
  if(s==='miss')btns+=`<button class="ghost" data-act="skip" data-id="${w.id}">Marcar como saltado</button>`;
  if(future)btns+=`<button class="ghost" data-act="move" data-id="${w.id}">Mudar de dia</button>`;
  return `<section class="card ${hero?'hero':''}">
    <div class="row between"><span class="eyebrow">${DOW[dow(w.date)]} ${fmtDate(w.date)}</span><div class="row">${stPill}${zonePill(z)}</div></div>
    <div class="row between"><h2>${esc(w.title)}</h2><span class="num muted">${F?(w.min||25)+' min':nf(w.km)+' km'}</span></div>
    ${why?`<div class="small muted">${esc(why)}</div>`:''}
    <ul class="steps">${w.steps.map(stepHtml).join('')}</ul>
    ${w.strength?'<div class="small muted">Força (opcional, 20 min): agachamentos, lunges, ponte de glúteos, gémeos e prancha.</div>':''}
    ${l?logSummary(l):''}
    <div class="btns">${btns}</div>
  </section>`;
}
function logSummary(l){
  if(l.wtype==='F')return `<div class="note up">Sessão de força feita.</div>`;
  return `<div class="note ${l.eval?.cls||'info'}"><div class="num"><b>${nf(Math.round(l.dist*100)/100)} km</b> · ${fmtTime(l.time)} · ${fmtPace(l.time/l.dist)}/km${l.avgHr?` · ${l.avgHr} bpm`:''} · esforço ${l.rpe}/10</div><div>${esc(l.eval?.msg||'')}</div></div>${l.ai?`<div class="note info"><span class="tiny muted">Treinador IA</span><br>${esc(l.ai)}</div>`:''}`;
}

/* ---------- Adaptação ---------- */
function adapt(){
  // 1) prova/teste → VDOT direto (já aplicado no registo)
  // 2) duas sessões de qualidade seguidas acima/abaixo do alvo → ajusta VDOT
  const q=st.logs.filter(l=>l.eval&&l.eval.flag!==undefined&&l.wtype==='Q').sort((a,b)=>a.date<b.date?-1:1);
  const fresh=q.filter(l=>!l.used);
  if(fresh.length>=2){
    const [a,b]=fresh.slice(-2);
    if(a.eval.flag==='up'&&b.eval.flag==='up'){const o=st.vdot;st.vdot=Math.round((st.vdot+0.6)*10)/10;a.used=b.used=true;st.vdotHist.push({d:TODAY,v:st.vdot,why:'2 sessões acima do alvo'});addNote(`Duas sessões seguidas mais rápidas do que o previsto: subi os ritmos (forma ${o.toFixed(1)} → ${st.vdot.toFixed(1)}).`,'up');}
    else if(a.eval.flag==='down'&&b.eval.flag==='down'){const o=st.vdot;st.vdot=Math.round((st.vdot-0.6)*10)/10;a.used=b.used=true;st.vdotHist.push({d:TODAY,v:st.vdot,why:'2 sessões abaixo do alvo'});addNote(`Duas sessões seguidas abaixo do alvo: aliviei os ritmos (forma ${o.toFixed(1)} → ${st.vdot.toFixed(1)}).`,'down');}
  }
  checkFatigue();
}
function checkFatigue(){
  const from=addDays(TODAY,-7);
  const recent=st.logs.filter(l=>l.date>=from&&l.date<=TODAY);
  const fat=recent.filter(l=>l.eval?.fatigue).length;
  const missed=allW().filter(w=>w.date>=from&&w.date<TODAY&&status(w)==='miss').length;
  const nw=st.plan.weeks.find(w=>w.start>TODAY);
  if(!nw||nw.recovery||nw.phase==='taper'||nw.adjusted)return;
  const key=nw.start;
  if(st.dismissed?.includes(key)||st.suggest?.week===key)return;
  if(fat>=2)st.suggest={week:key,why:`Tiveste ${fat} treinos com esforço muito alto nos últimos 7 dias.`};
  else if(missed>=2)st.suggest={week:key,why:`Falhaste ${missed} treinos nos últimos 7 dias.`};
}
function applyRecovery(){
  const wk=st.plan.weeks.find(w=>w.start===st.suggest.week);
  if(wk){for(const w of wk.workouts){
    if(w.type==='E'||w.type==='L'){for(const s of w.steps){if(s.km){s.km=r05(s.km*0.8);s.t=s.t.replace(/^[\d.,]+ km/,`${nf(s.km)} km`);}}}
    if(w.type==='Q'){for(const s of w.steps){if(s.reps){s.reps=Math.max(2,Math.round(s.reps*0.7));s.t=s.t.replace(/^\d+ ×/,`${s.reps} ×`);}}}
    w.km=Math.round(stepsKm(w.steps)*10)/10;
  }wk.adjusted=true;}
  addNote(`Semana de ${fmtDate(st.suggest.week)} reduzida cerca de 20% para recuperares.`,'info');
  st.suggest=null;
}

  const done=wk?wk.workouts.filter(w=>logFor(w)).reduce((a,w)=>a+logFor(w).dist,0):0;

  let out='';
  if(st.suggest){out+=`<section class="card suggest"><h3>Sugestão: aliviar a próxima semana</h3><div class="small">${esc(st.suggest.why)} Recomendo reduzir a semana de ${fmtDate(st.suggest.week)} em cerca de 20%.</div><div class="btns"><button class="primary" data-act="sugg-yes">Aplicar</button><button class="ghost" data-act="sugg-no">Ignorar</button></div></section>`;}
  if(st.gcal?.pending&&st.gcal?.last)out+=`<section class="card"><div class="row between"><span class="small">O plano mudou. O teu Google Calendar está por atualizar.</span><button data-act="gc-now">Atualizar</button></div></section>`;

  out+=`<section class="card"><div class="row between"><span class="eyebrow">Semana ${wk?wk.n:''} · ${wk?PH[wk.phase]+(wk.recovery?' (recuperação)':''):''}</span><span class="num small muted">${nf(Math.round(done*10)/10)} / ${nf(Math.round(plan))} km</span></div><div class="week">${strip}</div></section>`;
  out+=`<section class="card"><div class="stats">
    <div class="stat"><span class="v">${fmtTime(pred)}</span><span class="l">Previsão ${g.label}</span></div>
    <div class="stat"><span class="v">${st.vdot.toFixed(1)}</span><span class="l">Índice de forma</span></div>
    <div class="stat"><span class="v">${days!==null&&days>=0?days:'–'}</span><span class="l">${days!==null&&days>=0?'Dias para a prova':'Sem prova marcada'}</span></div>
  </div></section>`;
  out+=`<button class="ghost" data-act="log-extra">Registar corrida fora do plano</button>`;
  if(st.notes.length)out+=`<section class="card"><h3>Ajustes do treinador</h3>${st.notes.slice(0,5).map(n=>`<div class="note ${n.kind}"><span class="tiny muted">${fmtDate(n.d)}</span><br>${esc(n.text)}</div>`).join('')}</section>`;
  return out;

function planoHtml(){
  const cur=weekOf(TODAY);
  return `<div class="row between"><h2>O teu plano</h2><span class="small muted">${st.plan.weeks.length} semanas</span></div>`+st.plan.weeks.map(wk=>{
    const tot=wk.workouts.reduce((a,w)=>a+w.km,0);
    const done=wk.workouts.filter(w=>status(w)==='done').length;
    return `<details class="wk" ${cur&&cur.n===wk.n?'open':''}><summary><div><h3>Semana ${wk.n}</h3><div class="small muted">${fmtDate(wk.start)} · ${PH[wk.phase]}${wk.recovery?' · recuperação':''}${wk.adjusted?' · aliviada':''}</div></div><div class="num small" style="text-align:right">${Math.round(tot)} km<br><span class="muted">${done}/${wk.workouts.length} feitos</span></div></summary>

}

function progHtml(){
  const p=st.profile,g=GOALS[p.goal];
  const H=st.vdotHist.slice(-20);
  const preds=H.map(h=>predict(h.v,g.km*1000));
  let chart='';
  if(H.length>=1){
    const W=560,Ht=170,pl=46,pr=12,pt=14,pb=26;
    const mn=Math.min(...preds),mx=Math.max(...preds);const pad=Math.max((mx-mn)*0.2,20);
    const lo=mn-pad,hi=mx+pad;
    const X=i=>pl+(H.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(H.length-1));
    const Y=v=>pt+(v-lo)/(hi-lo)*(Ht-pt-pb); // tempos menores em cima
    const pts=preds.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
    const grid=[lo+pad,(lo+hi)/2,hi-pad].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="4" y="${Y(v)+4}">${fmtTime(v)}</text>`).join('');
    const area=H.length>1?`<polygon points="${X(0)},${Ht-pb} ${pts} ${X(H.length-1)},${Ht-pb}" fill="var(--accent)" opacity=".12"/>`:'';
    chart=`<svg class="chart" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Evolução da previsão para ${g.label}">${grid}${area}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${preds.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===preds.length-1?5:3}" fill="var(--accent)"/>`).join('')}<text x="${pl}" y="${Ht-6}">${fmtDate(H[0].d)}</text><text x="${W-pr}" y="${Ht-6}" text-anchor="end">${fmtDate(H[H.length-1].d)}</text></svg>`;
  }
  // volume semanal
  const wks=st.plan.weeks.filter(w=>w.start<=TODAY).slice(-8);
  let bars='';
  if(wks.length){
    const W=560,Ht=150,pb=24,pt=10;
    const data=wks.map(w=>({n:w.n,plan:w.workouts.reduce((a,x)=>a+x.km,0),done:w.workouts.reduce((a,x)=>a+(logFor(x)?.dist||0),0)+st.logs.filter(l=>l.extra&&l.date>=w.start&&l.date<addDays(w.start,7)).reduce((a,l)=>a+l.dist,0)}));
    const mx=Math.max(...data.map(d=>Math.max(d.plan,d.done)),10);
    const bw=(W-20)/data.length;
    bars=`<svg class="chart" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Quilómetros por semana, previsto e feito">${data.map((d,i)=>{const x=10+i*bw,h1=(d.plan/mx)*(Ht-pb-pt),h2=(d.done/mx)*(Ht-pb-pt);return `<rect x="${x+bw*0.15}" y="${Ht-pb-h1}" width="${bw*0.7}" height="${h1}" rx="3" fill="var(--line)"/><rect x="${x+bw*0.3}" y="${Ht-pb-h2}" width="${bw*0.4}" height="${h2}" rx="3" fill="var(--accent)"/><text x="${x+bw/2}" y="${Ht-8}" text-anchor="middle">S${d.n}</text><text x="${x+bw/2}" y="${Ht-pb-Math.max(h1,h2)-4}" text-anchor="middle">${Math.round(d.done)}</text>`;}).join('')}</svg><div class="row small muted"><span class="pill" style="background:var(--line)">previsto</span><span class="pill" style="background:var(--accent);color:var(--accent-ink);border:none">feito</span></div>`;
  }
  const logs=[...st.logs].sort((a,b)=>a.date<b.date?1:-1);
  return `<h2>Progresso</h2>
  ${recordsHtml()}
  <section class="card"><div class="row between"><h3>Previsão para ${g.label}</h3><span class="num">${fmtTime(predict(st.vdot,g.km*1000))}</span></div>${chart}<div class="small muted">Atualiza quando registas uma prova ou um teste, ou quando duas sessões de qualidade seguidas ficam acima ou abaixo do alvo.</div></section>
  <section class="card"><h3>Quilómetros por semana</h3>${bars||'<div class="small muted">Ainda sem semanas concluídas.</div>'}</section>
  <section class="card"><h3>Histórico</h3>${logs.length?logs.map(l=>{const w=allW().find(x=>x.id===l.wid)||allW().find(x=>x.date===l.date);return `<div><div class="row between"><b>${l.extra?'Corrida extra':esc(w?w.title:'Treino')}</b><span class="small muted">${fmtDate(l.date)}${l.source==='gpx'?' · GPX':l.source==='gps'?' · GPS':''}</span></div>${logSummary(l)}${l.splits&&l.splits.length>1?splitsHtml(l.splits):''}</div>`;}).join('<hr style="border:none;border-top:1px solid var(--line);width:100%">'):'<div class="small muted">Ainda não registaste treinos. Depois de cada corrida, exporta o GPX no Strava ou regista à mão.</div>'}</section>`;
}
function splitsHtml(sp){const mx=Math.max(...sp),mn=Math.min(...sp);return `<div class="tiny muted" style="margin-top:6px">Parciais por km</div><div class="split" aria-label="Parciais: ${sp.map(fmtPace).join(', ')}">${sp.map(s=>`<div title="${fmtPace(s)}" style="height:${20+80*(mx-s)/Math.max(mx-mn,1)}%"></div>`).join('')}</div><div class="tiny muted num">mais rápido ${fmtPace(mn)} · mais lento ${fmtPace(mx)}</div>`;}

function bindOnboard(){
  const upd=()=>{const t=parseTime($('#obRefT').value),d=Number($('#obRefD').value);const el=$('#obPrev');if(t>0){const v=vdotFrom(d*1000,t);const P=paces(v,ob.goal);el.textContent=`Ritmo fácil ${fmtPace(P.E[0])}–${fmtPace(P.E[1])}/km · previsão ${GOALS[ob.goal].label}: ${fmtTime(predict(v,GOALS[ob.goal].km*1000))}`;}else el.textContent='';};
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ob[b.dataset.k]=b.dataset.v==='true'?true:b.dataset.v==='false'?false:isNaN(b.dataset.v)?b.dataset.v:Number(b.dataset.v);b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));upd();});
  $('#obNoRace').onchange=e=>{ob.noRace=e.target.checked;$('#obDate').disabled=ob.noRace;};
  $('#obRefT').oninput=upd;$('#obRefD').onchange=upd;upd();
  if($('#obCancel'))$('#obCancel').onclick=()=>{ob=null;render();};
  $('#obGo').onclick=()=>{
    const t=parseTime($('#obRefT').value),d=Number($('#obRefD').value);
    const raceDate=ob.noRace?null:$('#obDate').value||null;
    if(!(t>0)){$('#obErr').textContent='Escreve o tempo como 27:30 ou 1:52:00.';return;}
    const v=vdotFrom(d*1000,t);
    if(!(v>18&&v<85)){$('#obErr').textContent='Esse tempo parece improvável para a distância escolhida. Confirma os valores.';return;}
    if(raceDate&&raceDate<=TODAY){$('#obErr').textContent='A data da prova tem de ser no futuro.';return;}
    const profile={goal:ob.goal,raceDate,refDist:d,refTime:$('#obRefT').value.trim(),days:ob.days,longDay:ob.longDay,level:ob.level,strength:ob.strength!==false};
    const keep=st?.profile;
    if(!keep)st={v:1,logs:[],notes:[],vdotHist:[],skipped:[],dismissed:[]};
    const changedRef=!keep||keep.refTime!==profile.refTime||keep.refDist!==profile.refDist;
    st.profile=profile;
    if(changedRef){st.vdot=Math.round(v*10)/10;st.vdotHist.push({d:TODAY,v:st.vdot,why:'tempo de referência'});}
    st.plan=genPlan(profile,TODAY);
    // reassociar registos a treinos novos pela data
    for(const l of st.logs){if(l.extra)continue;const w=allW().find(x=>x.date===l.date&&((l.wtype==='F')===(x.type==='F')));l.wid=w?w.id:null;if(!w)l.extra=true;}
    st.suggest=null;
    addNote(keep?'Plano refeito a partir de hoje.':`Plano criado: ${st.plan.weeks.length} semanas até ${raceDate?fmtDate(raceDate):'ao teste final'}.`,'info');
    ob=null;persist();tab='hoje';location.hash='#hoje';render();toast('Plano pronto');
  };
}

/* ---------- Ajustes: ações ---------- */
function saveFile(filename,data){
  try{const type=filename.endsWith('.ics')?'text/calendar':'application/json';const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);}
  catch(e){$('#dlNote').textContent='Não foi possível descarregar o ficheiro neste navegador.';}
}
function icsText(){
  const P=pz();const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Zone5//EN','CALSCALE:GREGORIAN'];
  const escI=s=>s.replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;').replace(/\n/g,'\\n');
  for(const w of allW()){if(w.date<TODAY)continue;
    const desc=w.steps.map(s=>`${tr(s.t)} — ${s.z==='F'?tr(s.d):s.z==='R'&&!s.reps?tr('solto e rápido'):paceTxt(s.z)}${s.rest?' ('+tr('rec.')+' '+tr(s.rest)+')':''}`).join('\n');
    const d=w.date.replace(/-/g,''),e=addDays(w.date,1).replace(/-/g,'');
    lines.push('BEGIN:VEVENT',`UID:${w.id}-${d}@zone5`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${e}`,`SUMMARY:${escI(tr(w.title)+' · '+(w.type==='F'?(w.min||25)+' min':nf(w.km)+' km'))}`,`DESCRIPTION:${escI(desc)}`,'END:VEVENT');}
  lines.push('END:VCALENDAR');return lines.join('\r\n');
}

  $('#reset').onclick=()=>openSheet(`<h2>Apagar tudo?</h2><div class="small muted">O plano e todos os registos são removidos. Não dá para desfazer.</div><div class="btns"><button class="ghost" data-act="close">Cancelar</button><button class="primary" data-act="reset-yes">Apagar</button></div>`);

    else{const a=draft.gpx;body=`<div class="stats"><div class="stat"><span class="v">${nf(Math.round(a.dist*100)/100)}</span><span class="l">km</span></div><div class="stat"><span class="v">${fmtTime(a.moving||a.elapsed)}</span><span class="l">tempo em movimento</span></div><div class="stat"><span class="v">${fmtPace((a.moving||a.elapsed)/a.dist)}</span><span class="l">ritmo médio</span></div></div>
      <div class="small muted">${fmtDate(a.date)}${a.avgHr?` · FC média ${a.avgHr} bpm`:''}${a.fast?` · partes rápidas ${fmtPace(a.fast)}/km`:''}</div>${a.splits.length>1?splitsHtml(a.splits):''}${a.src==='gps'?'<div class="tiny muted">Gravado com o GPS do telemóvel.</div>':'<button class="link" data-act="gpx-clear">Escolher outro ficheiro</button>'}`;}
  }else{
    body=`<div class="grid2"><label for="mDist">Distância (km)<input id="mDist" inputmode="decimal" value="${w?nf(w.km):''}"></label><label for="mTime">Tempo<input id="mTime" inputmode="numeric" placeholder="45:00"></label></div>
    <label for="mDate">Data<input type="date" id="mDate" value="${draft.date}" max="${TODAY}"></label>

  }

  openSheet(head+body+`<label for="rpe">Esforço sentido: <span id="rpeV">${rpe}</span>/10<input type="range" id="rpe" min="1" max="10" value="${rpe}" style="padding:0"></label><div class="tiny muted">1–3 muito fácil · 4–6 confortável · 7–8 duro · 9–10 máximo</div>${opts}<div class="small" id="logErr" style="color:var(--bad)"></div><button class="primary" data-act="log-save">Guardar e analisar</button>`);
  $('#rpe').oninput=e=>{draft.rpe=+e.target.value;$('#rpeV').textContent=e.target.value;};

}
async function readGpx(f){
  if(!f)return;
  try{
    const txt=await f.text();
    const doc=new DOMParser().parseFromString(txt,'application/xml');
    const tps=[...doc.getElementsByTagNameNS('*','trkpt')];
    if(!tps.length)throw new Error('sem pontos');
    const raw=tps.map(n=>{const tm=n.getElementsByTagNameNS('*','time')[0];const hr=n.getElementsByTagNameNS('*','hr')[0];return{lat:+n.getAttribute('lat'),lon:+n.getAttribute('lon'),t:tm?Date.parse(tm.textContent)/1000:NaN,hr:hr?+hr.textContent:0};});
    const a=analyzePoints(raw);
    if(!a||a.dist<0.2)throw new Error('curto');
    prepAnalysis(a);renderLog();
  }catch(e){const el=$('#gpxErr');if(el)el.textContent='Não consegui ler este ficheiro. Confirma que é um .gpx exportado do Strava com GPS.';}
}
function prepAnalysis(a){
  {
    const t0=new Date(a.t0*1000);
    a.date=`${t0.getFullYear()}-${String(t0.getMonth()+1).padStart(2,'0')}-${String(t0.getDate()).padStart(2,'0')}`;
    let w=draft.wid?allW().find(x=>x.id===draft.wid):null;
    if(!w&&!draft.extra){w=allW().find(x=>x.date===a.date&&!logFor(x));if(w)draft.wid=w.id;}
    if(w&&(w.type==='Q'||w.type==='R')&&w.focus.z!=='E'){
      let m=(w.focus.km||0)*1000;
      if(w.focus.repSec)m=Math.round(w.focus.repSec/target(pz(),w.focus.z)*1000);
      if(m>=200&&m<=a.dist*1000)a.fast=bestEffort(a.pts,m);
    }
    a.best={};for(const m of [1000,5000,10000]){if(a.dist*1000>=m){const pc=bestEffort(a.pts,m);if(pc)a.best[m/1000]=pc*m/1000;}}
    a.pts=null;
    draft.gpx=a;draft.date=a.date;
  }
}
function saveLog(){
  const err=m=>{$('#logErr').textContent=m;};
  let log;
  const sel=$('#mWid');if(sel){draft.wid=sel.value||null;draft.extra=!sel.value;}
  if(draft.mode==='gpx'){
    const a=draft.gpx;if(!a)return err('Escolhe um ficheiro GPX ou muda para "À mão".');
    log={date:a.date,dist:a.dist,time:a.moving||a.elapsed,avgHr:a.avgHr,splits:a.splits,fast:a.fast||null,best:a.best||{},source:a.src||'gpx'};
  }else{
    const dist=parseFloat(String($('#mDist').value).replace(',','.')),time=parseTime($('#mTime').value);
    if(!(dist>0))return err('Indica a distância em km.');
    if(!(time>0))return err('Indica o tempo, por exemplo 45:00.');
    if(time/dist<120||time/dist>1200)return err('O ritmo resultante parece improvável. Confirma distância e tempo.');
    const fast=$('#mFast')?parseTime($('#mFast').value):NaN;
    log={date:$('#mDate').value||draft.date,dist,time,fast:fast>0?fast:null,source:'manual'};
  }
  log.rpe=draft.rpe||5;
  const w=draft.wid?allW().find(x=>x.id===draft.wid):null;
  if(w){log.wid=w.id;log.wtype=w.type;st.logs=st.logs.filter(l=>l.wid!==w.id);}else log.extra=true;
  log.eval=evaluate(log,w,st.vdot,st.profile.goal);
  if(log.eval.newVdot){const o=st.vdot;st.vdot=Math.round(log.eval.newVdot*10)/10;st.vdotHist.push({d:log.date,v:st.vdot,why:w.title});addNote(`${w.title}: ${fmtTime(log.time)}. Ritmos recalculados (forma ${o.toFixed(1)} → ${st.vdot.toFixed(1)}).`,st.vdot>=o?'up':'down');}
  st.logs.push(log);
  adapt();
  persist();closeSheet();render();
  toast(tr(log.eval.msg).split(/(?<=[.!?])\s/)[0]);
}

function moveTo(id,d){
  const w=allW().find(x=>x.id===id),wk=weekOf(w.date);
  const o=wk.workouts.find(x=>x.date===d&&x.id!==w.id);
  if(o&&!logFor(o))o.date=w.date;
  w.date=d;wk.workouts.sort((a,b)=>a.date<b.date?-1:1);
  const qs=wk.workouts.filter(x=>x.type==='Q'||x.type==='L');

/* ---------- Treino guiado ---------- */
function restSec(r){if(!r)return 90;let m=/(\d+)(?:\s*[–-]\s*(\d+))?\s*min/.exec(r);if(m)return(m[2]?(+m[1]+ +m[2])/2:+m[1])*60;m=/(\d+)\s*s/.exec(r);return m?+m[1]:90;}
function segments(w){
  const P=pz(),pc=z=>z==='E'?(P.E[0]+P.E[1])/2:target(P,z);const seg=[];
  for(const s of w.steps){
    if(s.z==='F')continue;
    if(!s.reps&&s.z==='R'&&!s.km){for(let i=1;i<=6;i++){seg.push({label:`Aceleração ${i} de 6`,sub:'Solto e rápido, sem sprintar',sec:20,z:'R'});if(i<6)seg.push({label:'Trote',sub:'Recupera a andar ou a trotar',sec:60,z:'E'});}continue;}
    if(!s.reps){seg.push({label:s.t,sub:paceTxt(s.z),sec:Math.round(s.km*pc(s.z)),z:s.z});continue;}
    for(let i=1;i<=s.reps;i++){
      const sec=s.repSec||Math.round(s.repKm*pc(s.z));
      seg.push({label:`Série ${i} de ${s.reps}${s.repKm&&!s.repSec?' · '+fmtKm(s.repKm):''}`,sub:paceTxt(s.z),sec,z:s.z});
      if(i<s.reps)seg.push({label:'Recuperação',sub:s.rest||'Trote leve',sec:s.repSec?60:restSec(s.rest),z:'E'});
    }
  }
  return seg;
}
let G=null;
function say(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);t=tr(t);u.text=t;u.lang=LANG==='pt'?'pt-PT':'en-GB';const vs=speechSynthesis.getVoices();const v=LANG==='pt'?(vs.find(v=>/^pt-PT/i.test(v.lang))||vs.find(v=>/^pt/i.test(v.lang))):(vs.find(v=>/^en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang)));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
function beep(f=880,d=0.15){try{G.ac=G.ac||new (window.AudioContext||window.webkitAudioContext)();const o=G.ac.createOscillator(),g=G.ac.createGain();o.frequency.value=f;o.connect(g);g.connect(G.ac.destination);g.gain.setValueAtTime(0.25,G.ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,G.ac.currentTime+d);o.start();o.stop(G.ac.currentTime+d);}catch(e){}}
const paceWords=t=>LANG==='pt'?t.replace(/(\d+):(\d\d)/g,(_,m,s)=>`${m} e ${+s}`).replace('/km',' por quilómetro').replace('–',' a '):tr(t).replace(/(\d+):(\d\d)/g,(_,m,s)=>`${m} ${s}`).replace('/km',' per kilometre').replace('–',' to ');
function startGuide(id){
  const w=allW().find(x=>x.id===id);const seg=segments(w);
  if(!seg.length)return;
  G={w,seg,i:0,left:seg[0].sec,run:false,last:0,beeped:-1,total:seg.reduce((a,x)=>a+x.sec,0)};
  try{navigator.wakeLock?.request('screen').then(l=>G&&(G.lock=l)).catch(()=>{});}catch(e){}
  renderGuide();
}
function renderGuide(){
  if(!G)return;const c=G.seg[G.i],n=G.seg[G.i+1];
  const done=G.seg.slice(0,G.i).reduce((a,x)=>a+x.sec,0)+(c.sec-G.left);
  openSheet(`<div class="row between"><span class="eyebrow">${esc(G.w.title)} · ${G.i+1}/${G.seg.length}</span><button class="link" data-act="g-stop">Terminar</button></div>
  <div style="height:6px;background:var(--line);border-radius:3px;overflow:hidden"><div style="height:100%;width:${Math.min(100,done/G.total*100)}%;background:var(--accent)"></div></div>
  <div class="row"><span class="pill z z${c.z}">${ZN[c.z]}</span></div>
  <h1 style="font-size:34px">${esc(c.label)}</h1>
  <div class="num" style="font-size:18px">${esc(c.sub)}</div>
  <div class="num" id="gT" style="font-family:var(--display);font-size:88px;font-weight:700;line-height:1;text-align:center;padding:12px 0">${fmtTime(Math.max(0,G.left))}</div>
  <div class="small muted">${n?`A seguir: <b>${esc(n.label)}</b> · ${esc(n.sub)}`:'Último bloco'}</div>
  ${G.gps?`<div class="stats" style="grid-template-columns:1fr 1fr 1fr"><div class="stat"><span class="v" id="gD">${nf((G.dist/1000).toFixed(2))}</span><span class="l">km (GPS)</span></div><div class="stat"><span class="v" id="gP">–</span><span class="l">ritmo atual</span></div><div class="stat"><span class="v" id="gF" style="font-size:18px">–</span><span class="l">vs alvo</span></div></div>${G.gpsErr?`<div class="small" style="color:var(--bad)">${esc(G.gpsErr)}</div>`:''}`:`<button class="ghost" data-act="g-gps">Gravar com o GPS do telemóvel</button>`}
  <div class="btns"><button class="primary" data-act="g-toggle">${G.run?'Pausa':G.i===0&&G.left===c.sec?'Começar':'Retomar'}</button><button data-act="g-next">Saltar bloco</button></div>
  <div class="tiny muted">Os blocos são por tempo, estimado a partir dos teus ritmos. Mantém o ecrã ligado: com o iPhone bloqueado, o temporizador e o GPS param. Se gravares no relógio ou no Strava, deixa o GPS da Zone5 desligado e regista depois com o GPX.</div>`);
}
function guideTick(){
  if(!G||!G.run)return;
  const now=Date.now();G.left-=(now-G.last)/1000;G.last=now;
  const L=Math.ceil(G.left);
  if(L<=3&&L>=1&&G.beeped!==L){G.beeped=L;beep(660);}
  if(G.left<=0){G.i++;if(G.i>=G.seg.length){finishGuide();return;}const c=G.seg[G.i];G.left=c.sec;G.beeped=-1;beep(990,0.3);say(`${c.label}. ${paceWords(c.sub)}`);renderGuide();return;}
  const el=$('#gT');if(el)el.textContent=fmtTime(Math.max(0,L));
  if(G.gps)updGps();
}
function gpsStart(){
  if(!navigator.geolocation){toast('Este navegador não tem GPS.');return;}
  G.gps=true;G.pts=[];G.dist=0;G.nextKm=1000;G.gpsErr='';
  G.watch=navigator.geolocation.watchPosition(p=>{
    if(!G)return;if(p.coords.accuracy>35)return;
    const q={lat:p.coords.latitude,lon:p.coords.longitude,t:p.timestamp/1000};
    const last=G.pts[G.pts.length-1];
    if(last){const d=hav(last,q);if(q.t-last.t<=0)return;if(G.run)G.dist+=d;}
    if(G.run||!last)G.pts.push(q);else{G.pts[G.pts.length-1]=q;}
    if(G.gpsErr){G.gpsErr='';renderGuide();}
    if(G.dist>=G.nextKm){const k=G.nextKm/1000;G.nextKm+=1000;const p2=curPace(240);say(`Quilómetro ${k}.${p2?' Ritmo '+paceWords(fmtPace(p2)):''}`);}
  },e=>{if(!G)return;G.gpsErr=e.code===1?'Sem autorização de localização. Ativa-a nas definições do navegador.':'Sem sinal de GPS por agora.';renderGuide();},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
  renderGuide();
}
function curPace(win=25){
  const P=G.pts;if(P.length<2)return null;const lt=P[P.length-1].t;let d=0,i=P.length-1;
  while(i>0&&lt-P[i-1].t<=win){d+=hav(P[i-1],P[i]);i--;}
  const t=lt-P[i].t;return d>20&&t>5?t/(d/1000):null;
}
function updGps(){
  const dEl=$('#gD');if(dEl)dEl.textContent=nf((G.dist/1000).toFixed(2));
  const pc=curPace();const pEl=$('#gP'),fEl=$('#gF');if(!pEl)return;
  pEl.textContent=pc?fmtPace(pc):'–';
  const c=G.seg[G.i];if(!fEl)return;
  if(!pc){fEl.textContent='–';return;}
  const P=pz();let lo,hi;if(c.z==='E'){lo=P.E[0];hi=P.E[1];}else if(c.z==='R'){fEl.textContent='solto';return;}else{const t=target(P,c.z);lo=t-5;hi=t+5;}
  fEl.textContent=pc<lo-3?'abranda':pc>hi+3?'acelera':'no ritmo';
  fEl.style.color=pc<lo-3||pc>hi+3?'var(--warn)':'var(--good)';
}
function gpsStop(){try{if(G?.watch!=null)navigator.geolocation.clearWatch(G.watch);}catch(e){}}
function gpsToLog(w){
  if(!G?.pts||G.pts.length<15||G.dist<200)return false;
  const a=analyzePoints(G.pts);if(!a||a.dist<0.2)return false;
  a.src='gps';draft={wid:w.id,extra:false,date:TODAY,mode:'gpx',gpx:null,rpe:6};prepAnalysis(a);return true;
}
setInterval(guideTick,250);
function finishGuide(){const id=G.w.id,w=G.w;say('Treino concluído. Bom trabalho.');gpsStop();const hasGps=gpsToLog(w);try{G.lock?.release();}catch(e){}G=null;if(hasGps){renderLog();toast('Treino gravado. Confirma o esforço e guarda.');return;}openSheet(`<h2>Treino concluído</h2><div class="small muted">Quando a corrida estiver no Strava, exporta o GPX e regista-a para a Zone5 a analisar.</div><div class="btns"><button class="primary" data-act="log" data-id="${id}">Registar agora</button><button class="ghost" data-act="close">Mais tarde</button></div>`);}

/* ---------- Recordes ---------- */
function records(){
  const runs=st.logs.filter(l=>l.wtype!=='F'&&l.dist>0);
  const best={};
  const put=(k,t,d)=>{if(t>0&&(!best[k]||t<best[k].t))best[k]={t,d};};
  for(const l of runs){
    for(const k in (l.best||{}))put(k,l.best[k],l.date);
    for(const k of [1,5,10,21.0975]){if(Math.abs(l.dist-k)/k<=0.03)put(k,l.time*k/l.dist,l.date);}
  }
  const longest=runs.reduce((a,l)=>!a||l.dist>a.dist?l:a,null);
  const total=runs.reduce((a,l)=>a+l.dist,0);
  let streak=0;const past=st.plan.weeks.filter(w=>addDays(w.start,7)<=TODAY).reverse();
  for(const w of past){const ws=w.workouts.filter(x=>x.type!=='F');if(!ws.length)continue;const d=ws.filter(x=>logFor(x)).length;if(d/ws.length>=0.75)streak++;else break;}
  return{best,longest,total,streak,n:runs.length};
}
function recordsHtml(){
  const r=records();
  const lab={1:'1 km',5:'5 km',10:'10 km',21.0975:'Meia'};
  const cells=Object.keys(lab).filter(k=>r.best[k]).map(k=>`<div class="stat"><span class="v">${fmtTime(r.best[k].t)}</span><span class="l">Melhor ${lab[k]} · ${fmtDate(r.best[k].d)}</span></div>`).join('');
  return `<section class="card"><h3>Recordes e conquistas</h3><div class="stats">
    <div class="stat"><span class="v">${Math.round(r.total)}</span><span class="l">km registados</span></div>
    <div class="stat"><span class="v">${r.longest?nf(Math.round(r.longest.dist*10)/10):'–'}</span><span class="l">Corrida mais longa (km)</span></div>
    <div class="stat"><span class="v">${r.streak}</span><span class="l">Semanas seguidas a cumprir</span></div>
    ${cells}</div><div class="tiny muted">Os melhores tempos saem dos troços mais rápidos dos teus ficheiros GPX e das corridas registadas com essa distância.</div></section>`;
}
function recapHtml(){
  if(dow(TODAY)>1)return'';
  const pw=st.plan.weeks.find(w=>w.start===addDays(mondayOf(TODAY),-7));if(!pw)return'';
  const ws=pw.workouts.filter(x=>x.type!=='F');const d=ws.filter(x=>logFor(x));
  const km=d.reduce((a,x)=>a+logFor(x).dist,0),pk=ws.reduce((a,x)=>a+x.km,0);
  const rate=ws.length?d.length/ws.length:0;
  const msg=rate>=0.99?'Semana completa. Excelente consistência.':rate>=0.75?'Boa semana: cumpriste quase tudo.':rate>=0.5?'Metade do plano feito. Esta semana tenta proteger os treinos-chave: o de qualidade e o longo.':'Semana difícil. Sem stress: retoma com calma e não tentes recuperar treinos perdidos.';
  return `<section class="card"><span class="eyebrow">Resumo da semana passada</span><div class="row between"><b class="num">${nf(Math.round(km*10)/10)} de ${Math.round(pk)} km</b><span class="small muted">${d.length}/${ws.length} treinos</span></div><div class="small">${msg}</div></section>`;
}

  const a=b.dataset.act,id=b.dataset.id;
  if(a==='log')openLog(id);

  else if(a==='log-save')saveLog();

  else if(a==='dellog'){const w=allW().find(x=>x.id===id);st.logs=st.logs.filter(l=>l!==logFor(w));persist();closeSheet();render();toast('Registo apagado');}
  else if(a==='skip'){st.skipped=st.skipped||[];st.skipped.push(id);persist();closeSheet();render();}
  else if(a==='sugg-yes'){applyRecovery();persist();render();toast('Semana aliviada');}
  else if(a==='sugg-no'){st.dismissed=st.dismissed||[];st.dismissed.push(st.suggest.week);st.suggest=null;persist();render();}
  else if(a==='fdone'){const w=allW().find(x=>x.id===id);st.logs.push({date:w.date<=TODAY?w.date:TODAY,wid:w.id,wtype:'F',dist:0,time:0,rpe:5});persist();closeSheet();render();toast('Força feita. Boa!');}
  else if(a==='move')openMove(id);
  else if(a==='move-to')moveTo(id,b.dataset.d);
  else if(a==='guide')startGuide(id);
  else if(a==='g-toggle'){if(!G)return;G.run=!G.run;G.last=Date.now();if(G.run&&G.i===0&&G.left===G.seg[0].sec){beep(990,0.3);say(`${G.seg[0].label}. ${paceWords(G.seg[0].sub)}`);}renderGuide();}
  else if(a==='g-next'){if(!G)return;G.left=0;G.run=true;G.last=Date.now();guideTick();}
  else if(a==='g-stop'){const w=G?.w;gpsStop();const hasGps=w&&gpsToLog(w);try{G?.lock?.release();speechSynthesis?.cancel();}catch(e){}G=null;if(hasGps){renderLog();toast('Corrida gravada. Confirma o esforço e guarda.');}else closeSheet();}
  else if(a==='g-gps'){if(G)gpsStart();}
  else if(a==='gc-off'){closeSheet();gcalSync(true,true);}
  else if(a==='lang')setLang(b.dataset.v);
  else if(a==='auth-go')authGo();
  else if(a==='auth-switch'){authMode=authMode==='in'?'up':'in';render();}
  else if(a==='auth-forgot'){const e=($('#aEmail').value||'').trim();if(!e)return $('#aErr').textContent='Escreve o teu email primeiro.';sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname}).then(()=>toast('Enviámos um email para recuperares a palavra-passe.'));}
  else if(a==='newpass'){const p=$('#np').value;if(p.length<8)return toast('Mínimo 8 caracteres.');sb.auth.updateUser({password:p}).then(({error})=>{toast(error?'Não foi possível mudar a palavra-passe.':'Palavra-passe atualizada');closeSheet();});}
  else if(a==='demo'){mode='demo';try{localStorage.setItem('zone5.mode','demo');}catch(e){}st=readLocal();setSync('local');render();}
  else if(a==='logout'){if(mode==='cloud'&&sb){sb.auth.signOut();}else{try{localStorage.removeItem('zone5.mode');}catch(e){}mode=null;st=null;authMode='up';render();}}
  else if(a==='g-create')gCreate();
  else if(a==='g-join')gJoin();
  else if(a==='g-reload'){grp.loaded=false;render();}
  else if(a==='g-week'){grp.week=b.dataset.v;render();}
  else if(a==='g-copy'){navigator.clipboard?.writeText(b.dataset.v).then(()=>toast('Link copiado'),()=>toast('Copia o link acima'));}
  else if(a==='g-leave')openSheet(`<h2>Sair do grupo?</h2><div class="small muted">Deixas de aparecer no ranking. Podes voltar a entrar com o código.</div><div class="btns"><button class="ghost" data-act="close">Cancelar</button><button class="primary" data-act="g-leave-yes">Sair</button></div>`);
  else if(a==='g-leave-yes')gLeave();
  else if(a==='gc-now')gcalSync(true);
  else if(a==='reset-yes'){st=null;try{localStorage.removeItem(lsKey());}catch(_){}if(mode==='cloud')sb.from('user_state').delete().eq('user_id',user.id).then(()=>{});closeSheet();ob=null;render();}
});


/* ---------- Google Calendar (API direta) ---------- */
const GSCOPE='https://www.googleapis.com/auth/calendar.app.created';
const TZ=Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Lisbon';
let gTok=null,gExp=0,tokClient=null,gcBusy=false,gcTimer=null;
function gcMsg(t,bad){const el=$('#gcMsg');if(el){el.textContent=t;el.style.color=bad?'var(--bad)':'';}}
function getToken(interactive){
  return new Promise((res,rej)=>{
    if(gTok&&Date.now()<gExp-60000)return res(gTok);
    if(!interactive)return rej({code:'need_click'});
    if(!CONFIG.GOOGLE_CLIENT_ID||!window.google?.accounts?.oauth2)return rej({code:'unavailable'});
    tokClient=tokClient||google.accounts.oauth2.initTokenClient({client_id:CONFIG.GOOGLE_CLIENT_ID,scope:GSCOPE,callback:()=>{}});
    tokClient.callback=r=>{if(r.error)return rej({code:'denied',message:r.error});gTok=r.access_token;gExp=Date.now()+(+r.expires_in||3600)*1000;res(gTok);};
    tokClient.error_callback=e=>rej({code:e?.type==='popup_closed'?'closed':'denied'});
    tokClient.requestAccessToken({prompt:st.gcal?.last?'':'consent'});
  });
}
async function gapi(method,path,body){
  const r=await fetch('https://www.googleapis.com/calendar/v3'+path,{method,headers:{Authorization:'Bearer '+gTok,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(r.status===401){gTok=null;throw{code:'need_click'};}
  if(r.status===404||r.status===410)throw{code:'not_found'};
  if(r.status===403||r.status===429)throw{code:'limit'};
  if(!r.ok)throw{code:'http',message:r.status};
  return r.status===204?{}:r.json();
}
function gcWant(w){
  const time=st.gcal?.time||'allday';
  const lg=logFor(w);
  const summary=w.type==='F'?`${lg?'✅':'💪'} ${tr(w.title)} · ${w.min||25} min`:`${lg?'✅':'🏃'} ${tr(w.title)} · ${nf(w.km)} km`;
  const lines=w.steps.map(s=>`• ${tr(s.t)}: ${s.z==='F'?tr(s.d):s.z==='R'&&!s.reps?tr('solto e rápido'):paceTxt(s.z)}${s.rest?' ('+tr('rec.')+' '+tr(s.rest)+')':''}`);
  if(WHY[w.title])lines.unshift(tr(WHY[w.title]),'');
  if(lg&&w.type!=='F')lines.push('',`${L('Feito','Done')}: ${nf(Math.round(lg.dist*100)/100)} km ${L('em','in')} ${fmtTime(lg.time)} (${fmtPace(lg.time/lg.dist)}/km)`);
  const body={summary,description:lines.join('\n'),extendedProperties:{private:{z5id:w.id}},reminders:{useDefault:true}};
  if(time==='allday'){body.start={date:w.date};body.end={date:addDays(w.date,1)};}
  else{const [h,m]=time.split(':').map(Number);const dur=w.type==='F'?(w.min||25):Math.max(30,Math.round((w.km*pz().E[0]/60+15)/5)*5);const e=Math.min(h*60+m+dur,23*60+59);body.start={dateTime:`${w.date}T${time}:00`,timeZone:TZ};body.end={dateTime:`${w.date}T${String(Math.floor(e/60)).padStart(2,'0')}:${String(e%60).padStart(2,'0')}:00`,timeZone:TZ};}
  return body;
}
function gcSig(){const f=allW().filter(w=>w.date>=TODAY);let h=0;const str=(st.gcal?.time||'')+JSON.stringify(f.map(w=>{const x=gcWant(w);return[w.id,x.summary,x.description,x.start];}));for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))|0;return h;}
function maybeAutoSync(){
  if(!st||!st.plan||!st.gcal?.last||st.gcal.auto===false)return;
  clearTimeout(gcTimer);gcTimer=setTimeout(()=>{if(gcSig()!==st.gcal.sig){if(gTok&&Date.now()<gExp-60000)gcalSync(false);else{st.gcal.pending=true;if(tab==='hoje')render();}}},2500);
}
function gcErr(e){
  const c=e&&e.code;
  if(c==='unavailable')return'O Google Calendar ainda não está disponível. Recarrega a página e tenta outra vez.';
  if(c==='denied')return'Não deste autorização à Zone5 para usar o Google Calendar.';
  if(c==='closed')return'A janela da Google foi fechada antes de terminar.';
  if(c==='need_click')return'A ligação à Google expirou. Toca em sincronizar para voltar a ligar.';
  if(c==='limit')return'A Google limitou os pedidos por agora. Tenta daqui a uns minutos.';
  return'O Google Calendar não respondeu. Tenta outra vez daqui a pouco; o que já foi feito fica.';
}
async function gcalSync(manual,removeAll){
  if(gcBusy)return;
  st.gcal=st.gcal||{time:'allday',auto:true};
  gcBusy=true;const btn=$('#gcSync');if(btn)btn.disabled=true;
  let made=0,upd=0,del=0;
  try{
    await getToken(manual);
    if(removeAll){
      if(st.gcal.calId){try{await gapi('DELETE',`/calendars/${encodeURIComponent(st.gcal.calId)}`);}catch(e){if(e.code!=='not_found')throw e;}}
      st.gcal={time:st.gcal.time,auto:st.gcal.auto};gcBusy=false;persist();render();toast('Calendário Zone5 apagado');return;
    }
    gcMsg('A preparar o calendário…');
    const ensureCal=async()=>{if(!st.gcal.calId){const c=await gapi('POST','/calendars',{summary:L('Zone5 · treinos','Zone5 · training'),description:L('Plano de corrida da Zone5','Zone5 running plan'),timeZone:TZ});st.gcal.calId=c.id;}return st.gcal.calId;};
    let cid=await ensureCal();
    const list=async()=>{const ex={};let token='';let guard=0;do{const q=new URLSearchParams({timeMin:new Date(`${TODAY}T00:00:00`).toISOString(),maxResults:'2500',singleEvents:'true'});if(token)q.set('pageToken',token);const r=await gapi('GET',`/calendars/${encodeURIComponent(cid)}/events?${q}`);for(const ev of r.items||[]){const pid=ev.extendedProperties?.private?.z5id;if(pid&&!ex[pid])ex[pid]=ev;else ex['x-'+ev.id]=ev;}token=r.nextPageToken||'';}while(token&&++guard<10);return ex;};
    let existing;
    try{existing=await list();}catch(e){if(e.code!=='not_found')throw e;st.gcal.calId=null;cid=await ensureCal();existing={};}
    const fut=allW().filter(w=>w.date>=TODAY);const n=fut.length;let i=0;
    for(const w of fut){
      i++;if(i%3===0||i===n)gcMsg(`A atualizar o calendário: ${i}/${n}`);
      const want=gcWant(w),ex=existing[w.id];delete existing[w.id];
      if(ex){
        const same=ex.summary===want.summary&&(ex.description||'')===want.description&&(want.start.date?ex.start?.date===want.start.date:String(ex.start?.dateTime||'').slice(0,19)===want.start.dateTime);
        if(same)continue;
        await gapi('PUT',`/calendars/${encodeURIComponent(cid)}/events/${ex.id}`,want);upd++;
      }else{await gapi('POST',`/calendars/${encodeURIComponent(cid)}/events`,want);made++;}
    }
    for(const k in existing){try{await gapi('DELETE',`/calendars/${encodeURIComponent(cid)}/events/${existing[k].id}`);del++;}catch(e){if(e.code!=='not_found')throw e;}}
    st.gcal.last=Date.now();st.gcal.sig=gcSig();st.gcal.pending=false;
    gcBusy=false;persist();
    const parts=[made&&`${made} criados`,upd&&`${upd} atualizados`,del&&`${del} removidos`].filter(Boolean);
    const msg=parts.length?`Google Calendar atualizado: ${parts.join(', ')}.`:'O Google Calendar já estava em dia.';
    if(tab==='ajustes'||tab==='hoje')render();
    gcMsg(msg);if(manual||parts.length)toast(msg);
  }catch(e){gcBusy=false;if(e.code==='need_click'&&!manual){st.gcal.pending=true;if(tab==='hoje')render();}else{gcMsg(gcErr(e),true);if(manual)toast(gcErr(e));}if(made||upd||del)persist();}
  finally{gcBusy=false;const b=$('#gcSync');if(b)b.disabled=false;}
}
