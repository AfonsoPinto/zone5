<style>
/* Layout: dark, sporty one-column app; big rounded cards with zone-tinted gradients, workout profile bars, floating pill tab bar */
:root{
  --bg:#0a0d16; --surface:#141927; --surface2:#1c2233; --ink:#f3f5fa; --muted:#8b93a7; --line:#262d40;
  --accent:#ff5a3c; --accent2:#ff8a3d; --accent-ink:#ffffff; --soft:#1a2030;
  --good:#3ddc97; --warn:#ffb547; --bad:#ff5d6c;
  --zE:#3ddc97; --zM:#4da3ff; --zT:#ffb547; --zI:#ff5a3c; --zR:#b57bff; --zP:#ff3d8b; --zF:#7c8aa5; --zH:#ff8a3d; --zW:#5d6a85; --zX:#2dd4bf; --zG:#a78bfa;
  --display:"Archivo","Arial Black",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding-bottom:110px;background:radial-gradient(120% 60% at 100% 0%,rgba(255,90,60,.10),transparent 60%),var(--bg);background-attachment:fixed}
h1,h2,h3{font-family:var(--display);font-stretch:112%;font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em;line-height:1.08}
h1{font-size:32px} h2{font-size:26px} h3{font-size:18px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:620px;margin:0 auto;padding:0 18px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 0 6px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:32px;height:32px}
.brand h1{font-size:24px;font-stretch:125%;letter-spacing:.02em;text-transform:uppercase}
.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:999px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good);box-shadow:0 0 8px var(--good)} .dot.local{background:var(--warn)}
main{display:flex;flex-direction:column;gap:16px;padding:8px 0 12px}
.greet{display:flex;flex-direction:column;gap:2px;padding:6px 2px 2px}
.greet h1{font-size:34px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.card.hero{--zc:var(--accent);border:none;padding:20px;background:linear-gradient(155deg,color-mix(in srgb,var(--zc) 34%,var(--surface)) 0%,color-mix(in srgb,var(--zc) 10%,var(--surface)) 45%,var(--surface) 80%);box-shadow:0 18px 40px -18px color-mix(in srgb,var(--zc) 55%,transparent)}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);white-space:nowrap;letter-spacing:.01em}
.z{color:#0a0d16;border:none}
.zE{background:var(--zE)} .zM{background:var(--zM)} .zT{background:var(--zT)} .zI{background:var(--zI);color:#fff} .zR{background:var(--zR);color:#fff} .zP{background:var(--zP);color:#fff} .zF{background:var(--zF);color:#fff} .zH{background:var(--zH);color:#0a0d16} .zW{background:var(--zW);color:#fff} .zX{background:var(--zX);color:#06201c} .zG{background:var(--zG);color:#160a33}
.st-done{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent);background:color-mix(in srgb,var(--good) 12%,transparent)}
.st-miss{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.st-next{color:#fff;border:none;background:var(--accent)}
.wtitle{font-size:30px}
.metrics{display:flex;gap:22px;flex-wrap:wrap}
.metric{display:flex;flex-direction:column}
.metric b{font-family:var(--display);font-stretch:112%;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.metric span{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.profile{display:flex;align-items:flex-end;gap:2px;height:54px;padding:4px 0}
.profile i{display:block;border-radius:4px 4px 2px 2px;min-width:3px}
.steps{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:14px 1fr;gap:12px;align-items:start;padding:8px 0;position:relative}
.steps li:not(:last-child)::after{content:"";position:absolute;left:6px;top:26px;bottom:-6px;width:2px;background:var(--line)}
.steps .bar{width:14px;height:14px;border-radius:50%;margin-top:3px;box-shadow:0 0 0 4px var(--surface)}
.card.hero .steps .bar{box-shadow:none}
.steps .t{font-weight:700}
.steps .p{font-size:14px;color:var(--muted)}
button,.btn{font:inherit;font-weight:700;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:12px 18px;cursor:pointer;min-height:48px;transition:transform .08s ease}
button:active{transform:scale(.98)}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);border:none;box-shadow:0 10px 24px -10px var(--accent)}
button.ghost{background:transparent}
button.link{border:none;background:none;padding:6px 0;min-height:0;color:var(--accent);box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>*{flex:1 1 auto}
label{font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:6px}
input,select,textarea{font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--soft);color:var(--ink);min-height:48px;width:100%}
input[type=range]{accent-color:var(--accent);min-height:0}
input[type=checkbox]{accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px;background:var(--soft);padding:4px;border-radius:999px;border:1px solid var(--line)}
.seg button{flex:1 1 0;min-width:60px;padding:9px 8px;min-height:40px;border:none;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px;border-radius:16px;background:var(--soft);border:1px solid transparent;font-size:11.5px;cursor:pointer;min-height:76px;color:var(--muted);font-weight:700}
.day b{font-family:var(--display);font-size:18px;color:var(--ink)}
.day.today{background:var(--ink);color:var(--bg)}
.day.today b{color:var(--bg)}
.day .mk{width:8px;height:8px;border-radius:50%}
.day .km{font-variant-numeric:tabular-nums;color:inherit}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--display);font-stretch:112%;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.note{border-left:3px solid var(--line);padding:4px 0 4px 12px;font-size:14.5px}
.note.up{border-color:var(--good)} .note.down{border-color:var(--warn)} .note.info{border-color:var(--zM)}
.suggest{border:1px solid color-mix(in srgb,var(--warn) 60%,transparent);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
details.wk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.wk>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.wk>summary::-webkit-details-marker{display:none}
details.wk[open]>summary{border-bottom:1px solid var(--line)}
.wrow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;font-weight:400;border-radius:0;min-height:0;color:var(--ink);box-shadow:none}
.wrow:last-child{border-bottom:none}
.wrow .d{font-family:var(--display);font-size:15px;font-weight:800;line-height:1.1}
.table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.table td,.table th{padding:10px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.table th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;display:flex;justify-content:center}
nav.tabs .in{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:999px;box-shadow:0 12px 30px -12px rgba(0,0,0,.7)}
nav.tabs[hidden]{display:none}
.sports{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.sport{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;min-height:92px;border-radius:18px;text-align:center;font-weight:400;width:auto}
.sport .ic{font-size:26px}.sport b{font-size:15px}.sport[disabled],.sport.soon{opacity:.45}
.sport[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
button.primary.go{flex-basis:100%;font-size:18px;min-height:56px}
.cele{display:flex;flex-direction:column;gap:12px;text-align:center;align-items:stretch}.cele .stats{text-align:left}
.cele-ic{font-size:64px;line-height:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.tip{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.empty{align-items:center;text-align:center}
details.why summary{cursor:pointer;color:var(--accent);list-style:none}details.why summary::-webkit-details-marker{display:none}
.wknav{display:flex;align-items:center;justify-content:space-between;gap:8px}.wknav .chip{width:44px;min-width:44px;font-size:20px;padding:0}
.wkscroll{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;scrollbar-width:none;align-items:flex-start;-webkit-overflow-scrolling:touch}
.wkscroll::-webkit-scrollbar{display:none}.wkpage{flex:0 0 100%;scroll-snap-align:start;padding:0 1px;box-sizing:border-box}
.wkhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}.chips.scrollx::-webkit-scrollbar{display:none}.chips.scrollx .chip{flex:none}
.mhead{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 2px 2px}
.race .prep{margin-left:auto;display:flex;flex-direction:column;align-items:center;min-width:52px;line-height:1.1;color:var(--pc)}
.race .prep b{font-size:17px}.race .prep span{font-size:10px;color:var(--muted)}.race .prep i{font-style:normal;font-size:9.5px;text-align:center;margin-top:2px}
.slist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;text-align:left;width:100%;min-height:58px;font-weight:400}
.srow:last-child{border-bottom:none}.srow>span:nth-child(2){flex:1;display:flex;flex-direction:column;min-width:0}.srow .ic{font-size:22px}.srow .chev{color:var(--muted);font-size:22px}
.sheet>*{flex-shrink:0}.sheet .races{max-height:none;overflow:visible}
input,select,textarea{box-sizing:border-box;max-width:100%;min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.chips.scrollx{flex-shrink:0;padding-bottom:2px}
.seg.segx{overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}.seg.segx::-webkit-scrollbar{display:none}.seg.segx button{flex:none;padding-left:14px;padding-right:14px}
.race.rc{align-items:center}.rtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.tag{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}.tag.warn{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.setgroup{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 4px 0}
details.setc{padding:0;gap:0}details.setc>summary{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;list-style:none;min-height:56px}
details.setc>summary::-webkit-details-marker{display:none}details.setc>summary b{flex:1;font-size:16px}details.setc>summary .ic{font-size:20px;width:28px;text-align:center}
details.setc>summary .chev{color:var(--muted);font-size:22px;transition:transform .15s}details.setc[open]>summary .chev{transform:rotate(90deg)}
details.setc .setbody{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}
.shbtn{align-self:flex-start}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acts{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--soft)}
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 10px;border:none;border-radius:0;background:none;color:var(--ink);font-size:14.5px;font-weight:700;box-shadow:none}
.act+.act{border-left:1px solid var(--line)}.act .ico{color:var(--muted)}
.card>.acts:last-child{margin:2px -18px -18px;border:none;border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r);background:color-mix(in srgb,var(--ink) 3%,transparent)}
.card.hero>.acts:last-child{margin:2px -20px -20px}
.minis{display:flex;gap:8px;flex-wrap:wrap}
.mini{flex:1 1 0;justify-content:center;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:6px 10px;font-size:13.5px;font-weight:700;border-radius:999px;background:color-mix(in srgb,var(--ink) 6%,transparent);border:1px solid var(--line);color:var(--ink);width:auto}
.mini .ico{width:16px;height:16px;color:var(--muted)}
details.why>summary{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--muted);font-weight:600}details.why>summary::after{content:"›";transition:transform .15s}details.why[open]>summary::after{transform:rotate(90deg)}details.why>div{margin-top:6px}
.plan-ref{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);min-height:96px;font-weight:400}
.qa .qi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,var(--soft));color:var(--accent)}.qa .qi .ico{width:20px;height:20px}
.qa b{font-size:15px;line-height:1.2}.qa small{font-size:12.5px;color:var(--muted);line-height:1.25}
.emptyst{align-items:center;text-align:center;padding:28px 20px;gap:10px}.emptyst .eic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,var(--soft));color:var(--accent)}.emptyst .eic .ico{width:30px;height:30px}.emptyst .primary{align-self:stretch}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.addbtn{display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;border:1.5px dashed var(--line);color:var(--muted)}.addbtn .ico{color:var(--accent)}
.navme{display:grid;place-items:center;width:21px;height:21px}.navme svg{width:21px;height:21px}.navav{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:800;letter-spacing:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:var(--display)}
.avatar{width:38px;height:38px;min-height:0;padding:0;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 55%,var(--line));background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.02em;display:grid;place-items:center;flex:none}
.avatar[aria-current=page]{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.avatar.big{width:84px;height:84px;font-size:30px;border-width:3px}
.phead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:6px 0 2px}
.phead h2{margin-top:4px}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:4px 12px 4px 8px;font-size:14px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kv>div{background:var(--soft);border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;gap:2px;text-align:center}.kv.kv2{grid-template-columns:1fr 1fr}.kv.kv2 b{font-size:22px}.kv b{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}.kv span{font-size:11.5px;color:var(--muted);font-weight:600}

.phbox{display:flex;flex-direction:column;gap:8px}.phprev{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/9;background:var(--soft)}.phprev img{width:100%;height:100%;object-fit:cover}.phprev button{position:absolute;top:8px;right:8px;width:36px;height:36px;min-height:0;padding:0;border-radius:50%;background:rgba(0,0,0,.6);border:none;color:#fff}
.avwrap{position:relative;border:none;background:none;padding:0;min-height:0;border-radius:50%}.avwrap .cam{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;border:3px solid var(--bg)}.avwrap .cam .ico{width:15px;height:15px}

<script id="logic">
/* ===================== Lógica pura (ritmos, plano, análise) ===================== */
const GOALS={'5k':{km:5,label:'5 km'},'10k':{km:10,label:'10 km'},'meia':{km:21.0975,label:'Meia maratona'},'maratona':{km:42.195,label:'Maratona'}};
const ZN={E:'Fácil',M:'Ritmo maratona',T:'Limiar',I:'Intervalos',R:'Velocidade',P:'Ritmo de prova',F:'Força',H:'Subidas',W:'Caminhada',X:'Estação',G:'Ginásio'};
const zOf=w=>w.type==='F'?(w.hx?'X':w.gym?'G':'F'):(w.type==='E'||w.type==='L')?'E':w.focus.z;
const WHY={
 'Corpo inteiro A':'Treino de corpo inteiro: pernas, empurrar e puxar no mesmo dia. Começa pelos exercícios principais, com a técnica em primeiro lugar.',
 'Corpo inteiro B':'Variação com outros exercícios para trabalhar o corpo todo de outra forma. Sobe o peso quando fizeres todas as repetições com boa técnica.',

 'Estações B':'Remo, farmers carry, lunges e wall balls: a segunda metade da prova, onde se perde mais tempo. Mantém um ritmo que consegues repetir em todas as voltas.',
 'Corrida comprometida':'Corres 1 km logo a seguir a uma estação, com as pernas cansadas, como na prova. O objetivo é segurar o ritmo HYROX logo nos primeiros 200 m.',

 'Ritmo de prova':'Habitua o corpo e a cabeça ao ritmo exato que queres manter no dia da prova.',

};
const STRENGTH={

 B:[['Peso morto a 1 perna','3 × 10 por perna'],['Step-up num banco','3 × 10 por perna'],['Prancha lateral','3 × 30 s por lado'],['Dead bug','3 × 10'],['Saltos no lugar (pogo)','3 × 20']]
};
function mkStrength(v){return{type:'F',title:'Força '+v,steps:STRENGTH[v].map(([t,d])=>({t,d,z:'F'})),focus:{z:'F'},min:25};}
let LANG=(()=>{try{const s=localStorage.getItem('zone5.lang');if(s==='pt'||s==='en')return s;}catch(e){}try{return (navigator.language||'en').toLowerCase().startsWith('pt')?'pt':'en';}catch(e){return 'en';}})();
const L=(pt,en)=>LANG==='pt'?pt:en;
const DOW_PT=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'],DOW_EN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MES_PT=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],MES_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let DOW=LANG==='pt'?DOW_PT:DOW_EN,MES=LANG==='pt'?MES_PT:MES_EN;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const r05=x=>Math.round(x*2)/2;
const lc1=t=>t?t[0].toLowerCase()+t.slice(1):t;
const nf=x=>LANG==='pt'?String(x).replace('.',','):String(x);

// datas como 'AAAA-MM-DD' em UTC
const toD=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(Date.UTC(a,b-1,c));};
const toS=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=toD(s);d.setUTCDate(d.getUTCDate()+n);return toS(d);};
const dow=s=>(toD(s).getUTCDay()+6)%7;
const mondayOf=s=>addDays(s,-dow(s));
const daysBetween=(a,b)=>Math.round((toD(b)-toD(a))/864e5);
function localToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
const fmtDate=s=>{const d=toD(s);return LANG==='pt'?`${d.getUTCDate()} ${MES[d.getUTCMonth()]}`:`${MES[d.getUTCMonth()]} ${d.getUTCDate()}`;};

// tempos
function fmtPace(s){if(!isFinite(s)||s<=0)return '–';s=Math.round(s);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function fmtTime(s){if(!isFinite(s))return '–';s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`;}
function parseTime(str){if(!str)return NaN;{const d=String(str).trim();if(/^\d{3,6}$/.test(d)){const ss=+d.slice(-2),mm=+d.slice(-4,-2),hh=d.length>4?+d.slice(0,-4):0;if(ss<60&&mm<60)return hh*3600+mm*60+ss;}}const p=String(str).trim().replace(/[hH]/g,':').replace(/[^\d:.,]/g,'').split(':').map(x=>parseFloat(x.replace(',','.')));if(p.some(isNaN))return NaN;let s=0;for(const v of p)s=s*60+v;if(p.length===1)s=p[0]*60;return s;}

// modelo VDOT (Daniels & Gilbert)
const vo2At=v=>-4.6+0.182258*v+0.000104*v*v;
const pctMax=t=>0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);
function vdotFrom(m,s){const t=s/60;return vo2At(m/t)/pctMax(t);}
function velFor(vo2){const a=0.000104,b=0.182258,c=-(vo2+4.6);return(-b+Math.sqrt(b*b-4*a*c))/(2*a);}
const paceAtFrac=(vdot,f)=>60000/velFor(vdot*f);
function predict(vdot,m){let lo=m/12,hi=m/0.8;for(let i=0;i<70;i++){const mid=(lo+hi)/2;if(vdotFrom(m,mid)>vdot)lo=mid;else hi=mid;}return(lo+hi)/2;}
/* ---------- Geração do plano ---------- */
const TEMPL={2:[[2,'Q1'],[6,'L']],3:[[1,'Q1'],[3,'E'],[6,'L']],4:[[1,'Q1'],[2,'E'],[4,'Q2'],[6,'L']],5:[[0,'E'],[1,'Q1'],[3,'Q2'],[4,'E'],[6,'L']],6:[[0,'E'],[1,'Q1'],[2,'E'],[3,'Q2'],[4,'E'],[6,'L']]};

function stepsKm(steps){let k=0;for(const s of steps){if(s.reps)k+=s.reps*(s.repKm||0)+(s.reps-1)*(s.restKm||0);else k+=s.km||0;}return k;}

function mkEasy(km,strides){const st=[{t:`${nf(km)} km fácil`,km,z:'E'}];if(strides)st.push({t:'6 × 20 s rápidos, 1 min trote entre',km:0,z:'R'});return{type:'E',title:strides?'Fácil + acelerações':'Corrida fácil',steps:st,focus:{z:'E'}};}

function mkQ(kind,o){ // o: {vol, goal, level, scale}
  const wu=r05(clamp(o.vol*0.06,1.5,3)),cd=r05(clamp(o.vol*0.05,1,2.5));
  const W={t:`${nf(wu)} km aquecimento`,km:wu,z:'E'},C={t:`${nf(cd)} km retorno à calma`,km:cd,z:'E'};
  const sc=o.scale||1;
  if(kind==='fartlek'){const n=Math.round(clamp(o.vol*0.3*sc,6,12));return{type:'Q',title:'Fartlek',steps:[W,{t:`${n} × 1 min forte / 1 min fácil`,reps:n,repSec:60,repKm:0.25,restKm:0.15,z:'I'},C],focus:{z:'I',repSec:60}};}
  if(kind==='tempo'){const k=r05(clamp(o.vol*0.1*sc,2,6));return{type:'Q',title:'Tempo run',steps:[W,{t:`${nf(k)} km contínuo`,km:k,z:'T'},C],focus:{z:'T',km:k}};}
  if(kind==='cruise'){const rk=o.goal==='meia'||o.goal==='maratona'?2:1.6;const n=Math.round(clamp(o.vol*0.1*sc/rk,2,5));return{type:'Q',title:'Limiar fracionado',steps:[W,{t:`${n} × ${fmtKm(rk)}`,reps:n,repKm:rk,restKm:0.2,rest:'1 min trote',z:'T'},C],focus:{z:'T',km:rk}};}
  if(kind==='intervals'){const rk=o.goal==='5k'?0.8:1;const n=Math.round(clamp(o.vol*0.08*sc/rk,3,8));return{type:'Q',title:'Intervalos',steps:[W,{t:`${n} × ${fmtKm(rk)}`,reps:n,repKm:rk,restKm:0.4,rest:rk<1?'2 min trote':'2–3 min trote',z:'I'},C],focus:{z:'I',km:rk}};}
  if(kind==='racepace'){const rk=o.goal==='5k'?1:o.goal==='10k'?2:3;const n=Math.round(clamp(o.vol*0.12*sc/rk,2,5));return{type:'Q',title:'Ritmo de prova',steps:[W,{t:`${n} × ${fmtKm(rk)}`,reps:n,repKm:rk,restKm:0.3,rest:'2 min trote',z:'P'},C],focus:{z:'P',km:rk}};}
  if(kind==='mpace'){const k=r05(clamp(o.vol*0.18*sc,5,14));return{type:'Q',title:'Ritmo maratona',steps:[W,{t:`${nf(k)} km contínuo`,km:k,z:'M'},C],focus:{z:'M',km:k}};}
  if(kind==='sharpen'){const n=4;return{type:'Q',title:'Afinação',steps:[W,{t:`${n} × 1 km`,reps:n,repKm:1,restKm:0.3,rest:'2 min trote',z:'P'},C],focus:{z:'P',km:1}};}
  return mkEasy(r05(o.vol*0.15),true);
}
function fmtKm(k){return k<1?`${Math.round(k*1000)} m`:`${nf(k)} km`;}

function qKinds(phase,goal,level,recovery){
  const beg=level==='ini';
  let q1,q2;
  if(phase==='base'){q1=beg?'strides':'fartlek';q2='tempo';}
  else if(phase==='build'){q1=(goal==='5k'||goal==='10k')?'intervals':'cruise';q2=goal==='maratona'?'mpace':(goal==='meia'?'intervals':'cruise');if(beg&&q1==='intervals')q1='fartlek';}

  else {q1='sharpen';q2=null;}
  if(recovery)q2=null;
  return[q1,q2];
}

function paces(vdot,goal,opt){
  opt=opt||{};

}

function pickSpread(D,L,n){const cd=(a,b)=>{const d=Math.abs(a-b)%7;return Math.min(d,7-d);};const pick=[L];while(pick.length<n){let best=null,bd=-1;for(const d of D){if(pick.includes(d))continue;const m=Math.min(...pick.map(x=>cd(x,d)));if(m>bd){bd=m;best=d;}}if(best===null)break;pick.push(best);}return pick.sort((a,b)=>a-b);}
/* dias escolhidos → [dia, tipo]; o duro principal 2+ dias depois do longo, o segundo longe do primeiro e nunca na véspera do longo */
function slotsFor(p,days){

  let D=[...new Set(p.runDays)].sort((a,b)=>a-b);if(!D.includes(L))D.push(L);
  if(days&&D.length>days)D=pickSpread(D,L,days);
  const others=D.filter(d=>d!==L),gap=d=>(d-L+7)%7,dist=(a,b)=>Math.min((a-b+7)%7,(b-a+7)%7);
  const byGap=[...others].sort((a,b)=>gap(a)-gap(b));
  const q1=byGap.find(d=>gap(d)>=2&&gap(d)!==6)??byGap.find(d=>gap(d)!==6)??byGap[0];
  let q2=null;
  if(D.length>=4){const c=others.filter(d=>d!==q1&&dist(d,q1)>=2&&gap(d)>=2&&gap(d)!==6);q2=c.sort((a,b)=>Math.abs(gap(b)-gap(q1))-Math.abs(gap(a)-gap(q1)))[0]??null;}
  return D.map(d=>[d,d===L?'L':d===q1?'Q1':d===q2?'Q2':'E']);
}

function mkHills(o){const sc=o.scale||1;const wu=r05(clamp(o.vol*0.06,1.5,3)),cd=r05(clamp(o.vol*0.05,1,2.5));const n=Math.round(clamp(o.vol*0.25*sc,6,10));

function placeStrength(list,ws,p,i,n){
  const used=new Set(list.map(w=>dow(w.date)));const longD=(p.longDay??6);
  const free=[0,1,2,3,4,5,6].filter(d=>!used.has(d)&&d!==(longD+6)%7&&d!==longD);
  const pick=[];for(const d of free){if(pick.length>=n)break;if(pick.every(x=>Math.abs(x-d)>1))pick.push(d);}
  for(const d of free){if(pick.length>=n)break;if(!pick.includes(d))pick.push(d);}
  pick.slice(0,n).forEach((d,k)=>{const f=mkStrength(k===0?'A':'B');list.push({...f,id:`w${i}-f${d}`,date:addDays(ws,d),km:0});});

/* Começar a correr: 9 semanas, 3 dias, corrida + caminhada até 30 min seguidos */
function genStart(p,todayS,vdot){
  const mon0=mondayOf(todayS),shift=((p.longDay??6)-6+7)%7;

  const prog=[[1,1.5,8],[1.5,1.5,8],[2,1,8],[3,1.5,6],[5,1.5,4],[8,1.5,3],[12,1.5,2],[20,0,1],[25,0,1]];
  const weeks=[];
  for(let i=0;i<prog.length;i++){
    const ws=addDays(mon0,i*7);const [r,wk,n]=prog[i];let list=[];
    const sdays=slotsFor(p,3).map(x=>x[0]).sort((a,b)=>((a-(p.longDay??6)+6)%7)-((b-(p.longDay??6)+6)%7));
    sdays.forEach((d,j)=>{

      const warm={t:'5 min a andar',sec:300,km:0,z:'W'},cool={t:'5 min a andar',sec:300,km:0,z:'W'};
      let w;
      if(i===prog.length-1&&j===sdays.length-1)w={type:'E',title:'Desafio final: 30 min sem parar',steps:[warm,{t:'30 min a correr',sec:1800,km:Math.round(1800/eP*10)/10,z:'E'},cool],focus:{z:'E'},final:true};
      else if(wk===0)w={type:'E',title:'Corrida contínua',steps:[warm,{t:`${r} min a correr`,sec:r*60,km:Math.round(r*60/eP*10)/10,z:'E'},cool],focus:{z:'E'}};
      else w={type:'E',title:'Corrida e caminhada',steps:[warm,{t:`${n} × ${nf(r)} min a correr + ${nf(wk)} min a andar`,reps:n,repSec:r*60,restSec:wk*60,repKm:Math.round(r*60/eP*100)/100,restKm:0,rest:`${nf(wk)} min a andar`,z:'E'},cool],focus:{z:'E'}};
      w={...w,id:`w${i}-${d}`,date,km:Math.round(stepsKm(w.steps)*10)/10};
      list.push(w);
    });
    if(p.strength!==false)placeStrength(list,ws,p,i,1);
    list=list.filter(w=>w.date>=todayS).sort((a,b)=>a.date<b.date?-1:1);
    weeks.push({n:i+1,start:ws,phase:'base',recovery:false,workouts:list});

}

/* ---------- Boas práticas da corrida (aplicadas a todos os planos de corrida) ----------
   1) Volume semanal a subir no máximo ~10% (ou +3 km em volumes baixos).
   2) Longo com peso limitado na semana (35% com 5+ dias, 40% com 4, 50% com 3, 60% com 2) e duração máxima (~2h30, ~3h na maratona).
   3) 80/20: se a parte rápida passar ~30% do volume da semana, o longo fica todo fácil. */
function bpRun(plan,p,vdot){
  const pz0=paces(vdot||40,p.goal||'10k'),eP=(pz0.E[0]+pz0.E[1])/2,durCap=(p.goal==='maratona'||(p.raceKm||0)>30?180:150)*60/eP;
  const hardKm=w=>w.steps.reduce((a,s)=>a+(s.z&&!['E','W','F','G','X','R'].includes(s.z)?(s.reps?s.reps*(s.repKm||(s.repSec?s.repSec/240:0)):(s.km||0)):0),0);
  const setL=(w,k)=>{k=r05(Math.max(3,k));if(w.trail){const min=Math.round(k*pz0.E[1]*1.25/60/5)*5;w.steps=[{t:`${min} min em trilho (≈ ${nf(k)} km)`,km:k,z:'E'}];}else{w.title=w.title==='Longo com final rápido'?'Longo':w.title;w.steps=[{t:`${nf(k)} km fácil`,km:k,z:'E'}];}w.km=k;};
  const setE=(w,k)=>{k=r05(clamp(k,3,14));const st=w.steps.some(s=>s.z==='R');const e=mkEasy(k,st);w.steps=e.steps;w.km=Math.round(stepsKm(w.steps)*10)/10;};
  let prev=null;
  for(const wk of plan.weeks){
    const runs=wk.workouts.filter(w=>w.type!=='F'&&!w.race);if(!runs.length)continue;
    const taper=wk.phase==='taper'||wk.workouts.some(w=>w.race);
    const vol=()=>runs.reduce((a,w)=>a+(w.km||0),0);
    const L=runs.find(w=>w.type==='L'),Es=runs.filter(w=>w.type==='E');
    if(!taper){
      // 3) 80/20
      if(L&&L.title==='Longo com final rápido'&&runs.reduce((a,w)=>a+hardKm(w),0)/vol()>0.3)setL(L,L.km);
      // 2) peso e duração do longo
      if(L){const mar=p.goal==='maratona'||(p.raceKm||0)>30,half=!mar&&(p.goal==='meia'||(p.raceKm||0)>16);const cap=mar?({2:0.65,3:0.55,4:0.5}[runs.length]||0.45):({2:0.6,3:0.5,4:0.4}[runs.length]||0.35);const lim=Math.min(Math.max(cap*vol(),mar?Math.min(L.km,32):half?Math.min(L.km,16):0),durCap);
        if(L.km>lim+1){const d=L.km-lim;setL(L,lim);if(Es.length)Es.forEach(e=>setE(e,e.km+d/Es.length));}}

    }
    if(!wk.recovery&&!taper)prev=vol();
  }
  return plan;
}
function genPlan(p,todayS,vdot){const gt=p.goalType||'race';const pl=genPlanRaw(p,todayS,vdot);return gt==='race'||gt==='maintain'||gt==='back'?bpRun(pl,p,vdot):pl;}
function genPlanRaw(p,todayS,vdot){
  const gt=p.goalType||'race';
  if(gt==='start')return genStart(p,todayS,vdot);
  if(gt==='hyrox')return genHyrox(p,todayS,vdot);
  if(gt==='gym')return genGym(p,todayS);
  const goal=gt==='race'?p.goal:'10k';
  const g=GOALS[goal],days=clamp(Array.isArray(p.runDays)&&p.runDays.length>=2?p.runDays.length:p.days|0,2,7);
  const raceKm=p.raceKm||g.km,raceLabel=p.raceName||g.label;
  const terrain=gt==='race'?(p.terrain||'flat'):'flat';
  const mon0=mondayOf(todayS);
  const hasRace=gt==='race'&&p.raceDate&&p.raceDate>todayS;
  let N=hasRace?Math.floor(daysBetween(mon0,mondayOf(p.raceDate))/7)+1:gt==='back'?6:gt==='maintain'?12:({'5k':8,'10k':10,'meia':12,'maratona':16})[goal];
  N=clamp(N,1,30);
  const lvl={ini:14,int:24,ava:38}[p.level]||24;
  const dayF={2:0.7,3:0.85,4:1,5:1.15,6:1.3,7:1.4}[days];
  const goalF={'5k':0.9,'10k':1,'meia':1.1,'maratona':1.3}[goal]*(raceKm>43?1.1:1);
  let startVol=lvl*dayF*goalF;
  if(gt==='back')startVol*=0.6;
  const T=gt!=='race'?0:N<6?1:(hasRace?({'5k':1,'10k':1,'meia':2,'maratona':3})[goal]:1);
  const TW=Math.max(0,N-T);
  const peakF=gt==='back'?1.3:gt==='maintain'?1.1:{'5k':1.35,'10k':1.45,'meia':1.55,'maratona':1.7}[goal];
  let peakVol=Math.min(startVol*peakF,startVol*(1+0.08*Math.max(TW-1,0)));
  if(gt==='race'&&hasRace){const floor={maratona:{ini:42,int:52,ava:65},meia:{ini:28,int:35,ava:45}}[goal]?.[p.level||'int'];if(floor)peakVol=Math.max(peakVol,Math.min(floor,startVol*(1+0.1*Math.max(TW-2,0))));}
  const goalLong={'5k':[9,12,14],'10k':[12,15,18],'meia':[16,19,22],'maratona':[28,32,34]}[goal][{ini:0,int:1,ava:2}[p.level]??1];
  const peakLong=Math.min(goalLong,peakVol*((goal==='maratona'?0.6:0.45)+(days===2?0.12:days===3?0.05:0)));
  const startLong=clamp(startVol*0.3,4,peakLong);
  const nb=Math.round(TW*0.4),nbu=Math.round(TW*0.35);
  const taperF={1:[0.55],2:[0.75,0.5],3:[0.8,0.65,0.45]}[T]||[];
  const shift=((p.longDay??6)-6+7)%7;
  const weeks=[];
  for(let i=0;i<N;i++){
    let phase,vol,long,rec=false;
    if(i<TW){
      phase=gt==='back'||gt==='maintain'?'base':i<nb?'base':i<nb+nbu?'build':'peak';
      const f=TW>1?i/(TW-1):1;
      vol=startVol+(peakVol-startVol)*f;long=startLong+(peakLong-startLong)*f;
      if((i+1)%4===0&&i<TW-1){rec=true;vol*=0.78;long*=0.8;}
    }else{phase='taper';const j=i-TW;vol=peakVol*taperF[j];long=peakLong*({1:[0.5],2:[0.7,0.4],3:[0.75,0.6,0.35]}[T][j]);}
    const isLast=i===N-1;
    const ws=mondayOf(addDays(mon0,i*7));
    let [k1,k2]=qKinds(phase,goal,p.level,rec);
    if(gt==='back'){k1=i<2?'easy':i<4?'strides':'fartlek';k2=i>=4&&!rec?'tempo':null;}
    if(gt==='maintain'){const c=Math.floor(i/4)%3;k1=[ 'fartlek','intervals','cruise'][c];k2=rec?null:['tempo','cruise','tempo'][c];if(p.level==='ini'&&k1==='intervals')k1='fartlek';}
    const hillWeek=(phase==='build'||phase==='peak')&&!rec&&(terrain==='hilly'||terrain==='trail'||(terrain==='rolling'&&i%2===0));
    if(hillWeek){if(k2)k2='hills';else if(i%2===0)k1='hills';}
    const slots=slotsFor(p,days);
    const ws_=[];
    let qKm=0;const qs={};
    const o={vol,goal,level:p.level,scale:rec?0.75:1};
    const mk=k=>k==='hills'?mkHills(o):k==='strides'?mkEasy(r05(clamp(vol*0.2,3,8)),true):k==='easy'?mkEasy(r05(clamp(vol*0.2,3,8)),false):mkQ(k,o);
    for(const [d,k] of slots){
      if(k==='Q1'){const q=mk(k1);qs[d]=q;qKm+=stepsKm(q.steps);}
      if(k==='Q2'&&k2){const q=mk(k2);qs[d]=q;qKm+=stepsKm(q.steps);}
    }
    long=r05(long);
    const nE=slots.filter(([d,k])=>!qs[d]&&k!=='L').length;
    const eKm=nE?r05(clamp(Math.min((vol-long-qKm)/nE,Math.max(3,long*0.8)),3,12)):0;
    for(const [d,k] of slots){
      const date=addDays(ws,d);
      let w;
      if(qs[d])w=qs[d];
      else if(k==='L'){
        const fin=gt==='race'&&(goal==='maratona'||goal==='meia')&&terrain!=='trail'&&(phase==='build'||phase==='peak')&&!rec&&i%2===1;
        if(terrain==='trail'&&gt==='race'){const min=Math.round(long*paces(vdot||40,goal).E[1]*1.25/60/5)*5;w={type:'L',title:'Longo em trilho',steps:[{t:`${min} min em trilho (≈ ${nf(long)} km)`,km:long,z:'E'}],focus:{z:'E'},trail:true};}
        else if(fin){const z=goal==='maratona'?'M':'P';const fk=r05(clamp(long*0.3,3,10));w={type:'L',title:'Longo com final rápido',steps:[{t:`${nf(r05(long-fk))} km fácil`,km:r05(long-fk),z:'E'},{t:`${nf(fk)} km finais`,km:fk,z}],focus:{z:'E'}};}
        else w={type:'L',title:hillWeek&&terrain!=='flat'?'Longo com subidas':'Longo',steps:[{t:`${nf(long)} km fácil`,km:long,z:'E'}],focus:{z:'E'}};
      }else w=mkEasy(eKm,days>=4&&d===slots.find(([dd,kk])=>kk==='E'&&!qs[dd])?.[0]&&phase!=='taper'&&!(gt==='back'&&i<2));
      w={...w,id:`w${i}-${d}`,date,km:Math.round(stepsKm(w.steps)*10)/10};
      if(w.type==='E'&&p.strength===false&&(phase==='base'||phase==='build')&&!rec)w.strength=true;
      ws_.push(w);
    }
    let list=ws_;
    const test5=(id,date)=>({id,date,type:'R',title:'Teste: 5 km a fundo',steps:[{t:'2 km aquecimento',km:2,z:'E'},{t:'5 km a fundo',km:5,z:'P'},{t:'1 km retorno à calma',km:1,z:'E'}],focus:{z:'P',km:5,test:true},km:8});
    if(gt==='maintain'&&(i===5||i===11))list=list.map(w=>w.type==='L'?test5(w.id,w.date):w);
    if(isLast&&gt!=='maintain'){
      if(hasRace){
        const rd=p.raceDate;
        list=list.filter(w=>w.date<addDays(rd,-1));
        list=list.map(w=>w.type==='Q'&&w.date>addDays(rd,-3)?{...mkEasy(4,true),id:w.id,date:w.date,km:4}:w);
        list=list.filter(w=>w.type!=='L');
        const rk=Math.round(raceKm*10)/10;
        list.push({id:`w${i}-race`,date:rd,type:'R',title:`Prova: ${raceLabel}`,steps:[{t:`${fmtKm(rk)} em ritmo de prova`,km:raceKm,z:'P'}],focus:{z:'P',km:raceKm},km:rk,race:true});
      }else if(gt==='back'){list=list.map(w=>w.type==='L'?test5(w.id,w.date):w);}
      else{
        const tk=Math.min(g.km,10);
        list=list.map(w=>w.type==='L'?{id:w.id,date:w.date,type:'R',title:`Teste: ${fmtKm(tk)} a fundo`,steps:[{t:'2 km aquecimento',km:2,z:'E'},{t:`${fmtKm(tk)} a fundo`,km:tk,z:'P'},{t:'1 km retorno à calma',km:1,z:'E'}],focus:{z:'P',km:tk,test:true},km:tk+3}:w);
      }
    }
    if(p.strength!==false&&phase!=='taper')placeStrength(list,ws,p,i,rec||gt==='back'&&i<2?1:(terrain==='trail'?2:2));
    list=list.filter(w=>w.date>=todayS).sort((a,b)=>a.date<b.date?-1:1);
    weeks.push({n:i+1,start:ws,phase,recovery:rec,workouts:list});
  }
  return{start:mon0,weeks:weeks.filter(w=>w.workouts.length)};
}

async function unzipFirstFit(buf){

const FIT0=631065600,SEMI=180/2147483648;
function fitToAnalysis(f){
  const recs=f.record.filter(r=>r[253]!=null);if(recs.length<2)return null;
  const s=f.session[0]||{};

  const hasDist=recs.some(r=>r[5]!=null);
  let a;

    for(const r of recs){if(r[5]==null)continue;const p={t:r[253]+FIT0,d:r[5]/100};if(r[0]!=null){p.lat=r[0]*SEMI;p.lon=r[1]*SEMI;}if(pts.length&&p.t<=pts[pts.length-1].t)continue;pts.push(p);if(r[3]){hrS+=r[3];hrN++;}}

}
async function readFit(file){
  let buf=await file.arrayBuffer();
  if(new DataView(buf).getUint32(0,true)===0x04034b50)buf=await unzipFirstFit(buf);

  if(!a||a.dist<0.2)throw new Error('curto');

/* ---------- GPX ---------- */
function hav(a,b){const R=6371000,t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lon-a.lon)*t;const x=Math.sin(dl/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function analyzePoints(raw){
  const pts=[];let d=0,hrS=0,hrN=0,moving=0;
  for(let i=0;i<raw.length;i++){
    const p=raw[i];if(!isFinite(p.t))continue;
    if(pts.length){const q=pts[pts.length-1];const dd=hav(q,p),dt=p.t-q.t;if(dt<=0)continue;d+=dd;if(dd/dt>1.0&&dt<30)moving+=dt;}
    pts.push({lat:p.lat,lon:p.lon,t:p.t,d});
    if(p.hr){hrS+=p.hr;hrN++;}
  }
  if(pts.length<2)return null;
  const t0=pts[0].t;
  const splits=[];let next=1000,last=t0;
  for(const p of pts){if(p.d>=next){splits.push(p.t-last);last=p.t;next+=1000;}}
  return{pts,dist:d/1000,elapsed:pts[pts.length-1].t-t0,moving,avgHr:hrN?Math.round(hrS/hrN):null,splits,t0};
}
function bestEffort(pts,m){let j=0,best=Infinity;for(let i=0;i<pts.length;i++){while(j<pts.length&&pts[j].d-pts[i].d<m)j++;if(j>=pts.length)break;const t=pts[j].t-pts[i].t;if(t<best)best=t;}return isFinite(best)?best/(m/1000):null;}

function evaluate(log,w,vdot,goal,opt){
  const pz=paces(vdot,goal,opt);
  const pace=log.time/log.dist;
  const res={msg:'',cls:'info',flag:null,fatigue:false};
  if(!w){res.msg=`Corrida extra a ${fmtPace(pace)}/km.`;if(log.rpe>=8)res.fatigue=true;return res;}
  if(w.type==='R'){
    if(log.dist>=3){const v=vdotFrom(log.dist*1000,log.time);res.newVdot=v;res.cls=v>=vdot?'up':'down';res.msg=`${w.focus.test?'Teste':'Prova'} feito em ${fmtTime(log.time)}. Ritmos recalculados com base neste resultado.`;}
    else res.msg='Distância demasiado curta para recalcular os ritmos.';
    return res;
  }
  const planned=w.km||0;
  const short=planned&&log.dist<planned*0.7;
  if(w.type==='Q'&&w.focus.z!=='E'){
    const tgt=w.focus.z==='H'?null:target(pz,w.focus.z);
    const act=tgt?log.fast||null:null;
    if(act){
      const diff=(tgt-act)/tgt;
      if(diff>0.03){res.msg=`Partes rápidas a ${fmtPace(act)}/km, mais rápido do que o alvo (${fmtPace(tgt)}).`;res.cls='up';if(log.rpe<=7)res.flag='up';}
      else if(diff<-0.04){res.msg=`Partes rápidas a ${fmtPace(act)}/km, abaixo do alvo (${fmtPace(tgt)}).`;res.cls='down';res.flag='down';}
      else{res.msg=`Partes rápidas a ${fmtPace(act)}/km, em cima do alvo (${fmtPace(tgt)}).`;res.cls='up';}
    }else{
      res.msg=log.rpe<=5?'Sessão de qualidade com esforço baixo. Se se repetir, os ritmos podem subir.':log.rpe>=9?'Sessão muito dura.':'Sessão registada.';
      if(log.rpe>=9){res.cls='down';res.flag='down';}
    }
    if(log.rpe>=9)res.fatigue=true;
  }else if(w.trail||w.steps.some(x=>x.z==='W')){
    res.msg=log.rpe>=8?'Esforço alto. Na próxima vai mais devagar ou faz mais pausas a andar.':'Treino feito. Bom trabalho.';res.cls=log.rpe>=8?'down':'up';if(log.rpe>=8)res.fatigue=true;
  }else{
    const ef=pz.E[0];
    if(pace<ef*0.95){res.msg=`Ritmo médio ${fmtPace(pace)}/km: rápido para um treino fácil (alvo ${fmtPace(pz.E[0])}–${fmtPace(pz.E[1])}). Abranda para recuperar melhor.`;res.cls='down';}

    if(log.rpe>=8){res.fatigue=true;res.msg+=' O esforço foi alto para um fácil: atenção ao cansaço.';res.cls='down';}
  }
  if(short)res.msg+=` Fizeste ${nf(Math.round(log.dist*10)/10)} de ${nf(planned)} km previstos.`;
  return res;
}

function showErr(sel,m){const e=$(sel);m=tr(m);if(e){e.textContent=m;try{e.scrollIntoView({behavior:'smooth',block:'center'});}catch(_){}}toast(m);haptic();}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2800);}
function setSync(k){$('#syncDot').className='dot '+(k==='ok'?'ok':k==='local'?'local':'');$('#syncTxt').textContent=k==='ok'?'Sincronizado':k==='local'?(mode==='demo'?'Modo experiência':'Sem ligação'):k==='off'?'':'A ligar…';}

function readLocal(){try{const s=localStorage.getItem(lsKey());return s?JSON.parse(s):null;}catch(e){return null;}}

async function persist(){
  st.updated=Date.now();
  try{localStorage.setItem(lsKey(),JSON.stringify(st));}catch(e){}
  maybeAutoSync();
  if(mode!=='cloud'||!sb||!user)return;
  if(saving){pend=true;return;}
  saving=true;
  try{
    const {error}=await sb.from('user_state').upsert({user_id:user.id,state:st,updated_at:new Date(st.updated).toISOString()});
    if(error)throw error;
    setSync('ok');pushStats();pushPublic();if(PHO.todo().length&&!PHO.fl){PHO.fl=1;PHO.flush().finally(()=>PHO.fl=0);}clearTimeout(persist._pt);persist._pt=setTimeout(pushSync,4000);
  }catch(e){setSync('local');}
  saving=false;
  if(pend){pend=false;persist();}
}
async function loadCloud(){
  setSync('wait');
  const local=readLocal();
  try{
    const {data,error}=await sb.from('user_state').select('state,updated_at').eq('user_id',user.id).maybeSingle();
    if(error)throw error;
    const remote=data?.state||null;
    if(remote&&(!local||(remote.updated||0)>=(local.updated||0)))st=remote;
    else if(local)st=local;
    else{const demo=(()=>{try{return JSON.parse(localStorage.getItem('zone5.v1.demo'));}catch(e){return null;}})();st=demo||null;}
    try{if(st)localStorage.setItem(lsKey(),JSON.stringify(st));}catch(e){}
    if(st&&(!remote||(st.updated||0)>(remote.updated||0)))await persist();
    setSync('ok');
  }catch(e){st=local;setSync('local');toast('Sem ligação: estás a ver a última cópia guardada neste dispositivo.');}
}
async function boot(){
  gxEN();

    const {data}=await sb.auth.getSession();

    sb.auth.onAuthStateChange((ev,session)=>{if(ev==='SIGNED_OUT'){user=null;mode=null;st=null;render();}if(ev==='PASSWORD_RECOVERY'){openSheet(`<h2>Nova palavra-passe</h2><label for="np">Palavra-passe nova<input type="password" id="np" autocomplete="new-password"></label><button class="primary" data-act="newpass">Guardar</button>`);}});
  }
  if(!mode&&localStorage.getItem('zone5.mode')==='demo'){mode='demo';st=readLocal();setSync('local');}
  if(!mode)setSync('off');
  {const q=new URLSearchParams(location.search),sv=q.get('strava');if(sv){q.delete('strava');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash);setTimeout(()=>toast(sv==='ok'?L('Strava ligado. A importar corridas…','Strava connected. Importing runs…'):sv==='scope'?L('Para ligar, autoriza o acesso às atividades.','To connect, allow access to your activities.'):sv==='cancel'?L('Ligação ao Strava cancelada.','Strava connection cancelled.'):L('Não foi possível ligar ao Strava.',"Couldn't connect to Strava.")),600);if(sv==='ok')localStorage.removeItem('zone5.svSync');}}
  if(st&&st.profile&&st.tips===undefined)st.tips=1;
  if(st?.plan&&st.logs){let ch=false;for(const l of st.logs){if(!l.wid)continue;const w=allW().find(x=>x.id===l.wid);if(w&&w.date!==l.date&&Math.abs(daysBetween(l.date,w.date))<=6&&alignLogDay(l,w))ch=true;}if(ch)persist();}
  if(st&&st.profile){setTimeout(stravaTick,1500);checkFatigue();if(lightenAfter({date:addDays(mondayOf(TODAY),-1)}))persist();loadWeather();}
  render();
  setTimeout(maybeAutoSync,3000);
}

async function authGo2(){
  const email=$('#aEmail').value.trim(),pass=$('#aPass').value,err=m=>showErr('#aErr',m);

/* ---------- Estatísticas para o grupo ---------- */
let lastStats='';
function weekStats(start){
  const wk=st.plan.weeks.find(w=>w.start===start);
  const end=addDays(start,7);
  const runs=st.logs.filter(l=>l.wtype!=='F'&&l.dist>0&&l.date>=start&&l.date<end);
  const counts=x=>(x.type!=='F'||x.hx||x.gym)&&!x.free;
  const planned=wk?wk.workouts.filter(counts).length:0;
  const done=wk?wk.workouts.filter(x=>counts(x)&&logFor(x)).length:0;
  return{week_start:start,km:Math.round(runs.reduce((a,l)=>a+l.dist,0)*10)/10,runs:done,planned};
}
let noStreakCol=false;
async function pushStats(){
  if(mode!=='cloud'||!st?.plan)return;
  const cur=mondayOf(TODAY);
  syncFeed();const sk=records().streak;const rows=[weekStats(cur),weekStats(addDays(cur,-7))].map((r,i)=>({...r,user_id:user.id,updated_at:new Date().toISOString(),...(noStreakCol?{}:{streak:i?Math.max(0,sk):sk})}));
  const key=JSON.stringify(rows.map(r=>[r.week_start,r.km,r.runs,r.planned]));
  if(key===lastStats)return;
  try{let {error}=await sb.from('weekly_stats').upsert(rows);if(error&&!noStreakCol){noStreakCol=true;rows.forEach(r=>delete r.streak);({error}=await sb.from('weekly_stats').upsert(rows));}if(!error)lastStats=key;}catch(e){}
}

/* ---------- Meteorologia (Open-Meteo, sem chave) ---------- */
let WX=null;
const WXT={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌦️',63:'🌧️',65:'🌧️',66:'🌧️',67:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};
async function loadWeather(force){
  const loc=st?.wxLoc;if(!loc)return;
  try{const c=JSON.parse(localStorage.getItem('zone5.wx')||'null');if(!force&&c&&c.key===loc.lat+','+loc.lon&&Date.now()-c.t<3*3600e3){WX=c.d;return;}}catch(e){}
  try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max&timezone=auto&forecast_days=8`);
    if(!r.ok)return;const j=await r.json();const d={};(j.daily?.time||[]).forEach((t,i)=>d[t]={code:j.daily.weather_code[i],tmax:j.daily.temperature_2m_max[i],tmin:j.daily.temperature_2m_min[i],rain:j.daily.precipitation_sum[i],prob:j.daily.precipitation_probability_max[i],wind:j.daily.wind_speed_10m_max[i]});
    WX=d;try{localStorage.setItem('zone5.wx',JSON.stringify({key:loc.lat+','+loc.lon,t:Date.now(),d}));}catch(e){}
    if(tab==='hoje'&&!$('#sheetBg').classList.contains('open'))render();}catch(e){}
}
const badWx=x=>x&&((x.rain>=8&&x.prob>=60)||x.wind>=45||[82,95,96,99].includes(x.code));
const wxLine=x=>x?`${WXT[x.code]||''} ${Math.round(x.tmin)}–${Math.round(x.tmax)}°${x.prob!=null?` · ${x.prob}% ${L('chuva','rain')}`:''}${x.wind>=30?` · ${L('vento','wind')} ${Math.round(x.wind)} km/h`:''}`:'';
function wxSuggestHtml(){
  if(!WX)return'';
  const lr=allW().find(w=>w.type==='L'&&w.date>=TODAY&&w.date<=addDays(TODAY,6)&&!logFor(w));if(!lr||!badWx(WX[lr.date]))return'';
  const wk=weekOf(lr.date);const used=new Set(wk.workouts.map(w=>w.date));

  const sc=Math.min(1,max/Math.max(sw,sh)),cv=document.createElement('canvas');cv.width=Math.round(sw*sc);cv.height=Math.round(sh*sc);

  return square?cv.toDataURL('image/jpeg',q):await new Promise(r=>cv.toBlob(r,'image/jpeg',q));}

/* ---------- Adaptação ---------- */
function adapt(){
  // 1) prova/teste → VDOT direto (já aplicado no registo)
  // 2) duas sessões de qualidade seguidas acima/abaixo do alvo → ajusta VDOT
  const q=st.logs.filter(l=>l.eval&&l.eval.flag!==undefined&&l.wtype==='Q').sort((a,b)=>a.date<b.date?-1:1);
  const fresh=q.filter(l=>!l.used);
  if(fresh.length>=2){
    const [a,b]=fresh.slice(-2);
    if(a.eval.flag==='up'&&b.eval.flag==='up'){const o=st.vdot;st.vdot=Math.round((st.vdot+0.6)*10)/10;a.used=b.used=true;st.vdotHist.push({d:TODAY,v:st.vdot,why:'2 sessões acima do alvo'});addNote(`Duas sessões seguidas mais rápidas do que o previsto: subi os ritmos (forma ${o.toFixed(1)} → ${st.vdot.toFixed(1)}).`,'up');}
    else if(a.eval.flag==='down'&&b.eval.flag==='down'){const o=st.vdot;st.vdot=Math.round((st.vdot-0.6)*10)/10;a.used=b.used=true;st.vdotHist.push({d:TODAY,v:st.vdot,why:'2 sessões abaixo do alvo'});addNote(`Duas sessões seguidas abaixo do alvo: aliviei os ritmos (forma ${o.toFixed(1)} → ${st.vdot.toFixed(1)}).`,'down');}
  }
  checkFatigue();
}
function checkFatigue(){
  const from=addDays(TODAY,-7);
  const recent=st.logs.filter(l=>l.date>=from&&l.date<=TODAY);
  const fat=recent.filter(l=>l.eval?.fatigue).length;
  const missed=allW().filter(w=>w.date>=from&&w.date<TODAY&&status(w)==='miss').length;
  const nw=st.plan.weeks.find(w=>w.start>TODAY);
  if(!nw||nw.recovery||nw.phase==='taper'||nw.adjusted)return;
  const key=nw.start;
  if(st.dismissed?.includes(key)||st.suggest?.week===key)return;
  if(fat>=2)st.suggest={week:key,why:`Tiveste ${fat} treinos com esforço muito alto nos últimos 7 dias.`};
  else if(missed>=2)st.suggest={week:key,why:`Falhaste ${missed} treinos nos últimos 7 dias.`};
}
function applyRecovery(){
  const wk=st.plan.weeks.find(w=>w.start===st.suggest.week);
  if(wk){for(const w of wk.workouts){
    if(w.type==='E'||w.type==='L'){for(const s of w.steps){if(s.km){s.km=r05(s.km*0.8);s.t=s.t.replace(/^[\d.,]+ km/,`${nf(s.km)} km`);}}}
    if(w.type==='Q'){for(const s of w.steps){if(s.reps){s.reps=Math.max(2,Math.round(s.reps*0.7));s.t=s.t.replace(/^\d+ ×/,`${s.reps} ×`);}}}
    w.km=Math.round(stepsKm(w.steps)*10)/10;
  }wk.adjusted=true;}
  addNote(`Semana de ${fmtDate(st.suggest.week)} reduzida cerca de 20% para recuperares.`,'info');
  st.suggest=null;
}

function progHtml2(){
  const p=st.profile,g={km:gKm(),label:p.goalType==='hyrox'?'5 km':gLabel()};
  const H=st.vdotHist.slice(-20);
  const preds=H.map(h=>predict(h.v,g.km*1000));
  let chart='';
  if(H.length>=1){
    const W=560,Ht=190,pl=64,pr=12,pt=14,pb=32;
    const mn=Math.min(...preds),mx=Math.max(...preds);const pad=Math.max((mx-mn)*0.2,20);
    const lo=mn-pad,hi=mx+pad;
    const X=i=>pl+(H.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(H.length-1));
    const Y=v=>pt+(v-lo)/(hi-lo)*(Ht-pt-pb); // tempos menores em cima
    const pts=preds.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
    const grid=[lo+pad,(lo+hi)/2,hi-pad].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="4" y="${Y(v)+4}">${fmtTime(v)}</text>`).join('');
    const area=H.length>1?`<polygon points="${X(0)},${Ht-pb} ${pts} ${X(H.length-1)},${Ht-pb}" fill="var(--accent)" opacity=".12"/>`:'';
    chart=`<svg class="chart" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Evolução da previsão para ${g.label}">${grid}${area}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${preds.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===preds.length-1?5:3}" fill="var(--accent)"/>`).join('')}<text x="${pl}" y="${Ht-6}">${fmtDate(H[0].d)}</text><text x="${W-pr}" y="${Ht-6}" text-anchor="end">${fmtDate(H[H.length-1].d)}</text></svg>`;
  }
  // volume semanal
  const wks=st.plan.weeks.filter(w=>w.start<=TODAY).slice(-8);
  let bars='';
  if(wks.length){
    const W=560,Ht=180,pb=30,pt=26;
    const data=wks.map(w=>({n:w.n,plan:w.workouts.reduce((a,x)=>a+x.km,0),done:w.workouts.reduce((a,x)=>a+(logFor(x)?.dist||0),0)+st.logs.filter(l=>l.extra&&l.date>=w.start&&l.date<addDays(w.start,7)).reduce((a,l)=>a+l.dist,0)}));
    const mx=Math.max(...data.map(d=>Math.max(d.plan,d.done)),10);
    const bw=(W-20)/Math.max(data.length,6);
    bars=`<svg class="chart" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Quilómetros por semana, previsto e feito">${data.map((d,i)=>{const x=10+i*bw,h1=(d.plan/mx)*(Ht-pb-pt),h2=(d.done/mx)*(Ht-pb-pt);return `<rect x="${x+bw*0.15}" y="${Ht-pb-h1}" width="${bw*0.7}" height="${h1}" rx="3" fill="var(--line)"/><rect x="${x+bw*0.3}" y="${Ht-pb-h2}" width="${bw*0.4}" height="${h2}" rx="3" fill="var(--accent)"/><text x="${x+bw/2}" y="${Ht-6}" text-anchor="middle">S${d.n}</text><text x="${x+bw/2}" y="${Ht-pb-Math.max(h1,h2)-4}" text-anchor="middle">${Math.round(d.done)}</text>`;}).join('')}</svg><div class="legend"><span><i style="background:var(--line)"></i>${L('previsto','planned')}</span><span><i style="background:var(--accent)"></i>${L('feito','done')}</span></div>`;
  }
  const logs=[...st.logs].sort((a,b)=>a.date<b.date?1:-1);
  return `<h2>Progresso</h2>
  ${recordsHtml()}
  <section class="card"><div class="row between"><h3>Previsão para ${g.label}</h3><span class="num">${fmtTime(predict(st.vdot,g.km*1000))}</span></div>${chart}<div class="small muted">Atualiza quando registas uma prova ou um teste, ou quando duas sessões de qualidade seguidas ficam acima ou abaixo do alvo.</div></section>
  <section class="card"><h3>Quilómetros por semana</h3>${bars||'<div class="small muted">Ainda sem semanas concluídas.</div>'}</section>
  <section class="card"><h3>Histórico</h3>${logs.length?logs.map(l=>{const w=allW().find(x=>x.id===l.wid)||allW().find(x=>x.date===l.date);return `<div class="hitem"><div class="row between"><b>${l.extra?'Corrida extra':esc(w?w.title:'Treino')}</b><span class="small muted">${fmtDate(l.date)}${l.source==='gpx'?' · GPX':l.source==='gps'?' · GPS':''}</span></div>${logSummary(l)}${l.splits&&l.splits.length>1?splitsHtml(l.splits):''}</div>`;}).join('<hr style="border:none;border-top:1px solid var(--line);width:100%">'):'<div class="small muted">Ainda não registaste treinos. Depois de cada corrida, exporta o GPX no Strava ou regista à mão.</div>'}</section>`;
}

function obValidate(){

async function readGpx(f){
  if(!f)return;
  try{
    if(/\.(fit|zip)$/i.test(f.name)||!/\.gpx$/i.test(f.name)&&new Uint8Array(await f.slice(8,12).arrayBuffer()).join()==='46,70,73,84'){const a=await readFit(f);prepAnalysis(a);renderLog();return;}
    const txt=await f.text();
    const doc=new DOMParser().parseFromString(txt,'application/xml');
    const tps=[...doc.getElementsByTagNameNS('*','trkpt')];
    if(!tps.length)throw new Error('sem pontos');
    const raw=tps.map(n=>{const tm=n.getElementsByTagNameNS('*','time')[0];const hr=n.getElementsByTagNameNS('*','hr')[0];return{lat:+n.getAttribute('lat'),lon:+n.getAttribute('lon'),t:tm?Date.parse(tm.textContent)/1000:NaN,hr:hr?+hr.textContent:0};});
    const a=analyzePoints(raw);
    if(!a||a.dist<0.2)throw new Error('curto');
    prepAnalysis(a);renderLog();
  }catch(e){showErr('#gpxErr','Não consegui ler este ficheiro. Confirma que é um .gpx ou .fit de uma corrida com GPS ou distância.');}
}
function prepAnalysis(a){
  {
    const t0=new Date(a.t0*1000);
    a.date=`${t0.getFullYear()}-${String(t0.getMonth()+1).padStart(2,'0')}-${String(t0.getDate()).padStart(2,'0')}`;
    let w=draft.wid?allW().find(x=>x.id===draft.wid):null;
    if(!w&&!draft.extra){w=allW().find(x=>x.date===a.date&&!logFor(x));if(w)draft.wid=w.id;}
    if(w&&(w.type==='Q'||w.type==='R')&&w.focus.z!=='E'){
      let m=(w.focus.km||0)*1000;
      if(w.focus.repSec)m=Math.round(w.focus.repSec/target(pz(),w.focus.z)*1000);
      if(w.focus.z!=='H'&&m>=200&&m<=a.dist*1000)a.fast=bestEffort(a.pts,m);
      if(a.laps&&a.laps.length>1){const lf=stravaFast({laps:a.laps,splits:[]},w);if(lf)a.fast=lf;}
    }
    a.best={};for(const m of [1000,5000,10000]){if(a.dist*1000>=m){const pc=bestEffort(a.pts,m);if(pc)a.best[m/1000]=pc*m/1000;}}
    {const gp=(a.pts||[]).filter(p=>p.lat!=null);if(gp.length>5){const st2=Math.max(1,Math.floor(gp.length/200));a.route=gp.filter((p,i)=>i%st2===0||i===gp.length-1).map(p=>[Math.round(p.lat*1e5)/1e5,Math.round(p.lon*1e5)/1e5]);}}

    draft.gpx=a;draft.date=a.date;
  }
}

function freeDayFor(w){

  const hard=d=>wk.workouts.some(x=>x.id!==w.id&&x.date===d&&(x.type==='Q'||x.type==='L'||x.race)&&!st.skipped?.includes(x.id));
  const free=d=>!wk.workouts.some(x=>x.id!==w.id&&x.date===d&&x.type!=='F'&&!st.skipped?.includes(x.id));
  const c=Array.from({length:7},(_,i)=>addDays(wk.start,i)).filter(d=>d>w.date&&d>TODAY&&free(d));
  return c.find(d=>!hard(addDays(d,-1))&&!hard(addDays(d,1)))||c[0]||null;
}
function cantSkip(id,why,force){

    <div class="small muted">${esc(w.title)} é um treino importante. ${DOW[dow(d)]} ${fmtDate(d)} está livre.</div>
    <button class="primary" data-act="move-to" data-id="${w.id}" data-d="${d}">Passar para ${DOW[dow(d)]} ${fmtDate(d)}</button>
    <button class="ghost" data-act="cant-skip-final" data-id="${w.id}">Não, saltar</button>`);return;}}st.skipped=st.skipped||[];if(!st.skipped.includes(id))st.skipped.push(id);
  const after=allW().filter(x=>x.date>w.date&&!logFor(x)&&!st.skipped.includes(x.id));
  let n=0,msg='';
  if(why==='tired'){const q=after.find(x=>(x.type==='Q'||x.type==='L')&&daysBetween(w.date,x.date)<=4);if(q&&easyfy(q,q.type==='L'?0.75:0.8))n=1;msg=n?`Saltado. O próximo treino duro (${DOW[dow(q.date)]}) passou a fácil.`:'Saltado. Descansa bem.';}
  else if(why==='sick'||why==='pain'){const days=why==='sick'?3:5,f=why==='sick'?0.7:0.5;for(const x of after.filter(x=>daysBetween(w.date,x.date)<=days)){if(x.type==='F'&&why==='pain'){st.skipped.push(x.id);n++;}else if(easyfy(x,f))n++;}
    msg=why==='sick'?'Saltado. Os próximos 3 dias ficaram leves. Com febre, não corras.':'Saltado. Os próximos 5 dias ficaram leves e curtos. Se a dor continuar ou piorar ao correr, para e fala com um fisioterapeuta.';}
  else msg='Treino saltado.';
  addNote(`${fmtDate(w.date)}: ${w.title} saltado (${{tired:'cansaço',sick:'doença',pain:'dores',other:'impedimento'}[why]}).${n?` Ajustei ${n} treino${n>1?'s':''} a seguir.`:''}`,'down');
  const lw=lightenAfter(w);if(lw)msg+=' '+lw;
  persist();closeSheet();render();toast(msg);
}
function lightenAfter(w){

  if(lost*2<=runs.length)return'';

      if(x.type==='L')Object.assign(x,{title:'Longo',steps:[{t:`${nf(km)} km fácil`,km,z:'E'}],focus:{z:'E'},km});else Object.assign(x,mkEasy(km,false),{km});}}

function gpsStart(){

    const last=G.pts[G.pts.length-1];

    if(G.run||!last)G.pts.push(q);else{G.pts[G.pts.length-1]=q;}

    if(G.dist>=G.nextKm){const k=G.nextKm/1000;G.nextKm+=1000;const p2=curPace(240);say(`Quilómetro ${k}.${p2?' Ritmo '+paceWords(fmtPace(p2)):''}`);}
  },e=>{if(!G)return;G.gpsErr=e.code===1?'Sem autorização de localização. Ativa-a nas definições do navegador.':'Sem sinal de GPS por agora.';renderGuide();},{enableHighAccuracy:true,maximumAge:0,timeout:20000});

/* ---------- Recordes ---------- */
function records(){
  const runs=st.logs.filter(l=>l.wtype!=='F'&&l.dist>0);
  const best={};
  const put=(k,t,d)=>{if(t>0&&(!best[k]||t<best[k].t))best[k]={t,d};};
  for(const l of runs){
    for(const k in (l.best||{}))put(k,l.best[k],l.date);
    for(const k of [1,5,10,21.0975]){if(Math.abs(l.dist-k)/k<=0.03)put(k,l.time*k/l.dist,l.date);}
  }
  const longest=runs.reduce((a,l)=>!a||l.dist>a.dist?l:a,null);
  const total=runs.reduce((a,l)=>a+l.dist,0);
  let streak=0;const past=st.plan.weeks.filter(w=>addDays(w.start,7)<=TODAY).reverse();
  // 1 semana "protegida" por mês (doença, férias): não quebra a série
  const frozen=[],usedM=new Set();
  for(const w of past){const ws=w.workouts.filter(x=>(x.type!=='F'||x.hx||x.gym)&&!x.free);if(!ws.length)continue;const d=ws.filter(x=>logFor(x)).length;if(d/ws.length>=0.75)streak++;else{const m=w.start.slice(0,7);if(!usedM.has(m)&&d>0){usedM.add(m);frozen.push(w.start);continue;}break;}}
  return{best,longest,total,streak,frozen,n:runs.length};

/* ---------- Google Calendar (API direta) ---------- */
const GSCOPE='https://www.googleapis.com/auth/calendar.app.created';
const TZ=Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Lisbon';
let gTok=null,gExp=0,tokClient=null,gcBusy=false,gcTimer=null;
function gcMsg(t,bad){const el=$('#gcMsg');if(el){el.textContent=t;el.style.color=bad?'var(--bad)':'';}}
function getToken(interactive){
  return new Promise((res,rej)=>{
    if(gTok&&Date.now()<gExp-60000)return res(gTok);
    if(!interactive)return rej({code:'need_click'});
    if(!CONFIG.GOOGLE_CLIENT_ID||!window.google?.accounts?.oauth2)return rej({code:'unavailable'});
    tokClient=tokClient||google.accounts.oauth2.initTokenClient({client_id:CONFIG.GOOGLE_CLIENT_ID,scope:GSCOPE,callback:()=>{}});
    tokClient.callback=r=>{if(r.error)return rej({code:'denied',message:r.error});gTok=r.access_token;gExp=Date.now()+(+r.expires_in||3600)*1000;res(gTok);};
    tokClient.error_callback=e=>rej({code:e?.type==='popup_closed'?'closed':'denied'});
    tokClient.requestAccessToken({prompt:st.gcal?.last?'':'consent'});
  });
}
async function gapi(method,path,body){
  const r=await fetch('https://www.googleapis.com/calendar/v3'+path,{method,headers:{Authorization:'Bearer '+gTok,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(r.status===401){gTok=null;throw{code:'need_click'};}
  if(r.status===404||r.status===410)throw{code:'not_found'};
  if(r.status===403||r.status===429)throw{code:'limit'};
  if(!r.ok)throw{code:'http',message:r.status};
  return r.status===204?{}:r.json();
}
function gcWant(w){
  const time=st.gcal?.time||'allday';
  const lg=logFor(w);
  const summary=w.type==='F'?`${lg?'✅':'💪'} ${tr(w.title)} · ${w.min||25} min`:`${lg?'✅':'🏃'} ${tr(w.title)} · ${nf(w.km)} km`;
  const lines=w.steps.map(s=>`• ${tr(s.t)}: ${s.z==='F'?tr(s.d):s.z==='R'&&!s.reps?tr('solto e rápido'):paceTxt(s.z)}${s.rest?' ('+tr('rec.')+' '+tr(s.rest)+')':''}`);
  if(WHY[w.title])lines.unshift(tr(WHY[w.title]),'');
  if(lg&&w.type!=='F')lines.push('',`${L('Feito','Done')}: ${nf(Math.round(lg.dist*100)/100)} km ${L('em','in')} ${fmtTime(lg.time)} (${fmtPace(lg.time/lg.dist)}/km)`);
  const body={summary,description:lines.join('\n'),extendedProperties:{private:{z5id:w.id}},reminders:{useDefault:true}};
  if(time==='allday'){body.start={date:w.date};body.end={date:addDays(w.date,1)};}
  else{const [h,m]=time.split(':').map(Number);const dur=w.type==='F'?(w.min||25):Math.max(30,Math.round((w.km*pz().E[0]/60+15)/5)*5);const e=Math.min(h*60+m+dur,23*60+59);body.start={dateTime:`${w.date}T${time}:00`,timeZone:TZ};body.end={dateTime:`${w.date}T${String(Math.floor(e/60)).padStart(2,'0')}:${String(e%60).padStart(2,'0')}:00`,timeZone:TZ};}
  return body;
}
function gcSig(){const f=allW().filter(w=>w.date>=TODAY);let h=0;const str=(st.gcal?.time||'')+JSON.stringify(f.map(w=>{const x=gcWant(w);return[w.id,x.summary,x.description,x.start];}));for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))|0;return h;}
function maybeAutoSync(){
  if(!st||!st.plan||!st.gcal?.last||st.gcal.auto===false)return;
  clearTimeout(gcTimer);gcTimer=setTimeout(()=>{if(gcSig()!==st.gcal.sig){if(gTok&&Date.now()<gExp-60000)gcalSync(false);else{st.gcal.pending=true;if(tab==='hoje')render();}}},2500);
}
function gcErr(e){
  const c=e&&e.code;
  if(c==='unavailable')return'O Google Calendar ainda não está disponível. Recarrega a página e tenta outra vez.';
  if(c==='denied')return'Não deste autorização à Zone5 para usar o Google Calendar.';
  if(c==='closed')return'A janela da Google foi fechada antes de terminar.';
  if(c==='need_click')return'A ligação à Google expirou. Toca em sincronizar para voltar a ligar.';
  if(c==='limit')return'A Google limitou os pedidos por agora. Tenta daqui a uns minutos.';
  return'O Google Calendar não respondeu. Tenta outra vez daqui a pouco; o que já foi feito fica.';
}
async function gcalSync(manual,removeAll){
  if(gcBusy)return;
  st.gcal=st.gcal||{time:'allday',auto:true};
  gcBusy=true;const btn=$('#gcSync');if(btn)btn.disabled=true;
  let made=0,upd=0,del=0;
  try{
    await getToken(manual);
    if(removeAll){
      if(st.gcal.calId){try{await gapi('DELETE',`/calendars/${encodeURIComponent(st.gcal.calId)}`);}catch(e){if(e.code!=='not_found')throw e;}}
      st.gcal={time:st.gcal.time,auto:st.gcal.auto};gcBusy=false;persist();render();toast('Calendário Zone5 apagado');return;
    }
    gcMsg('A preparar o calendário…');
    const ensureCal=async()=>{if(!st.gcal.calId){const c=await gapi('POST','/calendars',{summary:L('Zone5 · treinos','Zone5 · training'),description:L('Plano de corrida da Zone5','Zone5 running plan'),timeZone:TZ});st.gcal.calId=c.id;}return st.gcal.calId;};
    let cid=await ensureCal();
    const list=async()=>{const ex={};let token='';let guard=0;do{const q=new URLSearchParams({timeMin:new Date(`${TODAY}T00:00:00`).toISOString(),maxResults:'2500',singleEvents:'true'});if(token)q.set('pageToken',token);const r=await gapi('GET',`/calendars/${encodeURIComponent(cid)}/events?${q}`);for(const ev of r.items||[]){const pid=ev.extendedProperties?.private?.z5id;if(pid&&!ex[pid])ex[pid]=ev;else ex['x-'+ev.id]=ev;}token=r.nextPageToken||'';}while(token&&++guard<10);return ex;};
    let existing;
    try{existing=await list();}catch(e){if(e.code!=='not_found')throw e;st.gcal.calId=null;cid=await ensureCal();existing={};}
    const fut=allW().filter(w=>w.date>=TODAY);const n=fut.length;let i=0;
    for(const w of fut){
      i++;if(i%3===0||i===n)gcMsg(`A atualizar o calendário: ${i}/${n}`);
      const want=gcWant(w),ex=existing[w.id];delete existing[w.id];
      if(ex){
        const same=ex.summary===want.summary&&(ex.description||'')===want.description&&(want.start.date?ex.start?.date===want.start.date:String(ex.start?.dateTime||'').slice(0,19)===want.start.dateTime);
        if(same)continue;
        await gapi('PUT',`/calendars/${encodeURIComponent(cid)}/events/${ex.id}`,want);upd++;
      }else{await gapi('POST',`/calendars/${encodeURIComponent(cid)}/events`,want);made++;}
    }
    for(const k in existing){try{await gapi('DELETE',`/calendars/${encodeURIComponent(cid)}/events/${existing[k].id}`);del++;}catch(e){if(e.code!=='not_found')throw e;}}
    st.gcal.last=Date.now();st.gcal.sig=gcSig();st.gcal.pending=false;
    gcBusy=false;persist();
    const parts=[made&&`${made} criados`,upd&&`${upd} atualizados`,del&&`${del} removidos`].filter(Boolean);
    const msg=parts.length?`Google Calendar atualizado: ${parts.join(', ')}.`:'O Google Calendar já estava em dia.';
    if(tab==='ajustes'||tab==='hoje')render();
    gcMsg(msg);if(manual||parts.length)toast(msg);
  }catch(e){gcBusy=false;if(e.code==='need_click'&&!manual){st.gcal.pending=true;if(tab==='hoje')render();}else{gcMsg(gcErr(e),true);if(manual)toast(gcErr(e));}if(made||upd||del)persist();}
  finally{gcBusy=false;const b=$('#gcSync');if(b)b.disabled=false;}
}

const EQ_L={machine:['Máquina','Machine'],cable:['Cabo','Cable'],bar:['Barra','Barbell'],db:['Halteres','Dumbbells'],kb:['Kettlebell','Kettlebell'],band:['Elástico','Band'],body:['Peso do corpo','Bodyweight']};
function exEq(n){
  if(/elástico|garrafas|mochila|toalha|mesa|cadeira/i.test(n))return /elástico/i.test(n)?'band':'body';
  if(/Kettlebell|swing/i.test(n))return 'kb';
  if(/máquina|Leg press|Peck|Hack|Smith|Chest press|assistidas|Abdução na|Adutores|Curl de pernas|Extensão de pernas|Hip thrust na|Gémeos sentado/i.test(n))return 'machine';
  if(/Remada em T/.test(n))return 'bar';
  if(/polia|cabo|Puxada|Pulldown|Crossover|Face pull|Pallof|corda/i.test(n))return 'cable';
  if(isBar(n))return 'bar';
  if(LIFT_BW.test(n))return 'body';
  return 'db';
}
const GRP_ORDER=['Peito','Costas','Ombros','Braços','Pernas','Posterior e glúteos','Core','Corpo inteiro','Chest','Back','Shoulders','Arms','Legs','Hamstrings and glutes','Full body'];
let GLF={q:'',grp:'all',eq:'all'};
function glRecent(){const seen=new Map();for(const n in (st.lifts||{})){const h=st.lifts[n];if(h.length)seen.set(n,h[h.length-1].d);}return [...seen.entries()].sort((a,b)=>a[1]<b[1]?1:-1).map(x=>x[0]).slice(0,6);}
function glAddExSheet(q){
  if(q!==undefined&&q!==null)GLF.q=q;

  const groups={};for(const x of list)(groups[x.g]=groups[x.g]||[]).push(x);
  const gnames=[...new Set(all.map(x=>x.g))].sort((a,b)=>GRP_ORDER.indexOf(a)-GRP_ORDER.indexOf(b));
  const rec=!f&&GLF.grp==='all'?glRecent().map(n=>all.find(x=>x.n===n)).filter(x=>x&&(GLF.eq==='all'||x.eq===GLF.eq)):[];
  const item=x=>`<button type="button" class="swi" data-act="gl-pick" data-v="${esc(x.n)}">${XA.has(x.n)?XA.svg(x.n,'xa xa-sw'):'<span class="xa-sw"></span>'}<span><b>${esc(tr(x.n))}</b><span class="tiny muted">${L(...EQ_L[x.eq])}${liftHist(x.n).length?' · '+L('Última vez','Last time')+': '+esc(liftLast(x.n)):''}</span></span></button>`;
  const chip=(k,v,l)=>`<button type="button" class="chip" data-act="glf" data-k="${k}" data-v="${esc(v)}" aria-pressed="${GLF[k]===v}">${esc(l)}</button>`;
  openSheet(`<div class="row between"><h2>${L('Adicionar exercício','Add exercise')}</h2><button class="link" data-act="gl-back">${L('Voltar','Back')}</button></div>
  <input id="glQ" placeholder="${L('Procurar exercício','Search exercise')}" value="${esc(GLF.q||'')}" autocomplete="off">
  <div class="chips scrollx">${chip('grp','all',L('Todos','All'))}${gnames.map(g=>chip('grp',g,g)).join('')}</div>
  <div class="chips scrollx">${chip('eq','all',L('Qualquer material','Any equipment'))}${Object.keys(EQ_L).filter(k=>all.some(x=>x.eq===k)).map(k=>chip('eq',k,L(...EQ_L[k]))).join('')}</div>
  ${rec.length?`<div class="small"><b>${L('Usados recentemente','Recently used')}</b></div><div class="swl">${rec.map(item).join('')}</div>`:''}
  <div id="glPick">${Object.entries(groups).sort((a,b)=>GRP_ORDER.indexOf(a[0])-GRP_ORDER.indexOf(b[0])).map(([gname,xs])=>`<div class="small"><b>${esc(gname)}</b> <span class="tiny muted">${xs.length}</span></div><div class="swl">${xs.map(item).join('')}</div>`).join('')||`<div class="card empty"><div class="small muted">${L('Nenhum exercício com estes filtros.','No exercise matches these filters.')}</div><button class="link" data-act="glf" data-k="reset" data-v="">${L('Limpar filtros','Clear filters')}</button></div>`}</div>`);
  document.querySelectorAll('#sheet .chips.scrollx').forEach(c=>{const on=c.querySelector('[aria-pressed="true"]');if(on)c.scrollLeft=Math.max(0,on.offsetLeft-c.clientWidth/2+on.clientWidth/2);});
  if(q===''){const sh=$('#sheet');if(sh)sh.scrollTop=0;}
  const qi=$('#glQ');if(qi){qi.oninput=()=>{const v=qi.value;clearTimeout(glAddExSheet._t);glAddExSheet._t=setTimeout(()=>{glAddExSheet(v);const n=$('#glQ');n.focus();n.setSelectionRange(v.length,v.length);},250);};}
}
function glPick(n){
  const g=st.gl;const spec=LIFT_BW.test(n)?'10–15':'8–12';
  g.ex.push({n,spec,rest:90,kind:'reps',bw:LIFT_BW.test(n),ss:null,sets:suggestSets(n,spec,3,false)});glSave();glRender();
  setTimeout(()=>$('#glx'+(g.ex.length-1))?.scrollIntoView({behavior:'smooth',block:'center'}),120);
}
function glFinish(force){
  const g=st.gl,w=glW();if(!g||!w)return;
  const left=g.ex.reduce((a,e)=>a+e.sets.filter(s=>!s.done).length,0),any=g.ex.some(e=>e.sets.some(s=>s.done));
  if(!any){toast(L('Marca pelo menos uma série com ✓ antes de terminar.','Tick at least one set before finishing.'));haptic();return;}
  if(left&&!force){const b=$('.gl-fin');if(b&&!b.dataset.c){b.dataset.c=1;b.textContent=L(`Faltam ${left} · confirmar`,`${left} left · confirm`);setTimeout(()=>{if(b.isConnected){delete b.dataset.c;b.textContent=L('Terminar','Finish');}},4000);return;}}
  const sets=[];for(const e of g.ex)for(const s of e.sets)if(s.done&&!s.wu&&e.kind!=='time')sets.push({n:e.n,kg:s.kg||0,reps:s.reps||0});
  const fake={w,sets};const oldG=G;G=fake;const prs=saveLifts();G=oldG;
  const time=Math.round((Date.now()-g.t0)/1000),vol=Math.round(sets.reduce((a,x)=>a+(x.kg||0)*(x.reps||0),0));
  if(w.free){w.steps=g.ex.map(e=>({t:e.n,z:'G',sets:e.sets.filter(s=>s.done&&!s.wu).length||e.sets.length,reps:e.spec,rest:e.rest,d:`${e.sets.length} × ${e.spec}`}));w.min=Math.max(10,Math.round(time/60));}
  let lg=logFor(w);if(!lg){lg={date:w.date<=TODAY?w.date:TODAY,wid:w.id,wtype:'F',dist:0,time:0,rpe:null};st.logs.push(lg);alignLogDay(lg,w);}
  Object.assign(lg,{time,vol,sets:sets.length,lifts:sets.length,gym:g.ex.map(e=>({n:e.n,s:e.sets.filter(s=>s.done&&!s.wu).map(s=>[s.kg||0,s.reps||0])})).filter(x=>x.s.length)});if(prs.length)lg.prs=prs;
  st.gl=null;clearInterval(GLT);try{GL_LOCK?.release();}catch(e){}GL_LOCK=null;
  say(L('Treino concluído. Bom trabalho.','Workout complete. Great job.'));persist();render();celebrate(lg,w);

function glGuide(){
  const g=st.gl,w=glW();if(!g||!w)return;
  const w2={...w,steps:[...(w.steps||[]).filter(s=>s.z!=='G'),...g.ex.filter(e=>e.kind!=='time'||true).map(e=>({t:e.n,z:'G',sets:e.sets.filter(q=>!q.wu).length,reps:e.spec,rest:e.rest,d:''}))]};
  const seg=segments(w2).filter(x=>!x.wu);if(!seg.length)return;
  const doneSets=[];const cur={};for(const e of g.ex){const fs=e.sets.find(s=>!s.done&&!s.wu)||e.sets[e.sets.length-1];cur[e.n]={...liftSuggest(e.n,e.spec,!!w.light),kg:fs.kg,reps:fs.reps};for(const s of e.sets)if(s.done&&!s.wu)doneSets.push({n:e.n,kg:s.kg,reps:s.reps});}
  let i=0;const cnt={};for(const x of doneSets)cnt[x.n]=(cnt[x.n]||0)+1;
  i=seg.findIndex(x=>x.z==='G'&&(x.si>(cnt[x.raw]||0)));if(i<0)i=0;
  st.gl=null;clearInterval(GLT);st.gymView='guide';
  G={w:w2,seg,i,left:seg[i].sec,up:0,times:[],run:false,last:0,beeped:-1,total:seg.reduce((a,x)=>a+x.sec,0),sets:doneSets,cur,t0:g.t0};
  persist();renderGuide();
}
function liftChartHtml(n){
  const h=liftHist(n);if(!h.length)return'';
  const pts=h.map(e=>{const top=e.sets.reduce((a,q)=>q[0]>a[0]||(q[0]===a[0]&&q[1]>a[1])?q:a,e.sets[0]);return{d:e.d,kg:top[0],r:top[1],e:e1rm(top[0],top[1]),vol:e.sets.reduce((a,q)=>a+q[0]*q[1],0)};});
  const W=340,H=150,p=44,ys=pts.map(x=>x.kg),mx=Math.max(...ys,1),mn=Math.min(...ys,mx-1);
  const X=i=>pts.length===1?W/2:p+(W-p-10)*i/(pts.length-1),Y=v=>H-22-(H-40)*(v-mn)/Math.max(1,mx-mn);
  const line=pts.map((x,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(x.kg).toFixed(1)}`).join('');
  const first=pts[0],last=pts[pts.length-1],diff=last.kg-first.kg;
  const chart=pts.length<2?`<div class="card empty" style="padding:14px"><div style="font-size:26px">📈</div><div class="small muted">${L('O gráfico aparece a partir do segundo treino com este exercício.','The chart appears from your second workout with this exercise.')}</div></div>`:`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${L('Evolução do peso','Weight progress')}">
   <text x="2" y="${Y(mx)+4}" fill="var(--muted)" font-size="11">${fmtKg(mx)}</text><text x="2" y="${Y(mn)-2}" fill="var(--muted)" font-size="11">${fmtKg(mn)}</text>
   <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.map((x,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(x.kg).toFixed(1)}" r="4" fill="var(--accent)"/>`).join('')}
   <text x="${p}" y="${H-4}" fill="var(--muted)" font-size="11">${fmtDate(first.d)}</text><text x="${W-10}" y="${H-4}" fill="var(--muted)" font-size="11" text-anchor="end">${fmtDate(last.d)}</text></svg>`;
  return `${chart}
  <div class="stats"><div class="stat"><span class="v">${fmtKg(last.kg)}</span><span class="l">${L('kg da última vez','kg last time')} × ${last.r}</span></div><div class="stat"><span class="v">${diff>0?'+':''}${fmtKg(diff)}</span><span class="l">${L('kg desde o início','kg since the start')}</span></div><div class="stat"><span class="v">${Math.round(Math.max(...pts.map(x=>x.e)))}</span><span class="l">${L('1RM estimado (kg)','Estimated 1RM (kg)')}</span></div></div>
  <div class="prl">${[...h].reverse().slice(0,8).map(e=>`<div class="prr"><span>${fmtDate(e.d)}</span><b class="num">${e.sets.map(q=>`${q[0]>0?fmtKg(q[0])+'×':''}${q[1]}`).join(' · ')}</b></div>`).join('')}</div>`;
}

/* ---------- Registo de erros e funil (anónimo) ---------- */
const SESS=(()=>{try{let x=localStorage.getItem('zone5.sess');if(!x){x=uuid().slice(0,18);localStorage.setItem('zone5.sess',x);}return x;}catch(e){return 'x';}})();
let errN=0;const errSeen=new Set(),evSeen=new Set();
function reportErr(msg,stack){try{if(!sb||APP_VER==='dev'||errN>=5)return;const k=String(msg).slice(0,120);if(errSeen.has(k))return;errSeen.add(k);errN++;
  let ctx='';try{ctx=`${mode||'-'}|${tab||''}|${ob?'ob:'+(obSteps()[ob.step]||ob.step):''}|${G?'guiado':''}${st?.gl?'lista':''}|${location.hash}`;}catch(_){}
  sb.from('app_errors').insert({ver:APP_VER,msg:String(msg).slice(0,500),stack:String(stack||'').slice(0,2000),ctx:ctx.slice(0,300),ua:navigator.userAgent.slice(0,300)}).then(()=>{},()=>{});}catch(e){}}
window.addEventListener('error',e=>reportErr(e.message,e.error?.stack||(e.filename+':'+e.lineno)));
window.addEventListener('unhandledrejection',e=>reportErr('promise: '+(e.reason?.message||e.reason),e.reason?.stack));
function track(ev,step,sport){try{if(!sb||APP_VER==='dev')return;const k=ev+'|'+step+'|'+sport;if(evSeen.has(k))return;evSeen.add(k);sb.from('app_events').insert({sess:SESS,ev,step:step||null,sport:sport||null,ver:APP_VER}).then(()=>{},()=>{});}catch(e){}}
